<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大类资产配置周报 · 线上版</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#152029;--ink2:#465360;--mut:#8b95a1;--line:#cfd6de;--hd:#e7ecf1;
--up:#bf262c;--dn:#0d7346;--warn:#a9670d;--accent:#25446b;--accent2:#3a6ea5;}
*{box-sizing:border-box;} html,body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:12px;line-height:1.4;}
/* 左侧目录 */
.side{position:fixed;top:0;left:0;width:210px;height:100vh;background:#1b2f47;color:#c9d4e0;overflow-y:auto;padding:14px 0;z-index:20;}
.side h2{font-size:13px;color:#fff;margin:0 0 4px;padding:0 16px;letter-spacing:.5px;}
.side .sub{font-size:10px;color:#7d90a8;padding:0 16px 10px;border-bottom:1px solid #2c4262;margin-bottom:8px;}
.side .grp{font-size:10.5px;color:#6f86a3;font-weight:700;letter-spacing:1px;padding:10px 16px 4px;}
.side a{display:block;color:#c9d4e0;text-decoration:none;font-size:12px;padding:5px 16px 5px 22px;border-left:3px solid transparent;cursor:pointer;}
.side a:hover{background:#22384f;color:#fff;}
.side a.on{background:#22384f;color:#fff;border-left-color:var(--accent2);font-weight:600;}
.side a .todo{float:right;font-size:9px;color:#6f86a3;border:1px solid #3a5170;padding:0 4px;border-radius:2px;}
/* 主区 */
.main{margin-left:210px;padding:0;}
.topbar{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--accent);padding:9px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
.topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.5px;color:var(--accent);}
.topbar .meta{font-size:11px;color:var(--ink2);}
.btns{display:flex;gap:8px;}
.btn{font-size:11px;padding:4px 12px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;border-radius:3px;}
.btn:hover{background:var(--accent);color:#fff;}
.btn.primary{background:var(--accent);color:#fff;}
.content{padding:12px 16px 50px;}
/* 导出页：4:3 容器，一块=一页PPT */
.export-page{background:var(--bg);max-width:1280px;margin:0 auto 18px;padding:9px 12px 7px;border:1px solid var(--line);}
.page-title{font-size:15px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:6px;margin:0 0 12px;}
.page-title .sub{font-size:11px;font-weight:400;color:var(--ink2);margin-left:8px;}
/* 组件 */
.sec{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--accent);border-left:3px solid var(--accent);padding-left:7px;margin:14px 0 7px;}
.card{background:var(--card);border:1px solid var(--line);padding:6px 9px;margin-bottom:7px;}
.ct{font-size:10.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--line);}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px;}
.kpi{background:var(--card);padding:5px 9px;}
.kpi-lab{color:var(--ink2);font-size:10.5px;margin-bottom:3px;}
.kpi-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.kpi-val.up{color:var(--up);} .kpi-val.dn{color:var(--dn);}
.kpi-unit{font-size:10px;color:var(--mut);font-weight:500;margin-left:2px;}
.kpi-sub{color:var(--mut);font-size:10px;margin-top:2px;}
table.grid{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
table.grid th{background:var(--hd);color:var(--ink2);font-weight:600;font-size:10.5px;padding:4px 7px;text-align:right;border:1px solid var(--line);white-space:nowrap;}
table.grid th:first-child,table.grid th:nth-child(2){text-align:left;}
table.grid td{padding:3px 7px;text-align:right;border:1px solid #e5eaef;white-space:nowrap;font-size:11px;line-height:1.55;}
table.grid td.sym{text-align:left;font-weight:600;}
table.grid td.cat{text-align:left;font-weight:700;color:var(--accent);background:#f2f5f8;}
table.grid tbody tr:hover{background:#eef3f8;}
table.grid td.hl{font-weight:700;}
.up{color:var(--up);} .dn{color:var(--dn);} .flat{color:var(--ink2);} .muted{color:var(--mut);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start;}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;margin-bottom:7px;}
.pg .full,.pg .hd,.pg .kpis{grid-column:1/-1;}
.pg.g12{grid-template-columns:repeat(12,1fr);}
.pg.g12 .w5{grid-column:span 5;} .pg.g12 .w7{grid-column:span 7;} .pg.g12 .w6{grid-column:span 6;}
.pg.g12 .w4{grid-column:span 4;}

.page-title.big{font-size:19px;letter-spacing:.5px;}
.cbox{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);padding:9px 12px;margin-bottom:8px;}
.cbox.hi{background:#f4f7fb;border-left-color:#b03a3f;}
.cbox .t{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:5px;letter-spacing:.5px;}
ul.lv1{margin:3px 0 3px 2px;padding-left:15px;}
ul.lv1>li{margin:3px 0;line-height:1.7;font-size:11px;}
ul.lv1>li::marker{color:var(--accent);}
ul.lv2{margin:2px 0 4px 0;padding-left:15px;list-style:none;}
ul.lv2>li{margin:2px 0;line-height:1.65;font-size:11px;color:var(--ink2);position:relative;padding-left:9px;}
ul.lv2>li:before{content:"·";position:absolute;left:0;color:#8b95a1;font-weight:700;}
.dl{color:#25446b;font-weight:700;}
.lbl{display:inline-block;min-width:34px;font-weight:700;color:var(--accent);}

/* table-layout:fixed 让百分比列宽真正生效，否则长列会把 逻辑支撑/分歧观点 挤成竖条 */
table.vt{width:100%;border-collapse:collapse;font-size:11px;line-height:1.78;table-layout:fixed;}
table.vt th{background:#e7ecf1;color:#465360;font-weight:600;font-size:10.5px;padding:6px 9px;text-align:left;border:1px solid var(--line);white-space:nowrap;}
table.vt td{padding:7px 9px;border:1px solid #e5eaef;vertical-align:top;font-size:11px;line-height:1.78;white-space:normal;word-break:normal;overflow-wrap:anywhere;}
table.vt tr:hover{background:#eef3f8;}
table.vt td.as{font-weight:700;white-space:normal;font-size:11px;}
table.vt td.pf{white-space:normal;font-variant-numeric:tabular-nums;font-size:11px;}
.inst{color:#25446b;font-weight:700;}
.srcchip{display:inline-block;background:#eef4fb;border:1px solid #cfdcea;color:#25446b;border-radius:3px;
 padding:1px 6px;margin:1px 3px 1px 0;font-size:10px;text-decoration:none;white-space:nowrap;}
.srcchip:hover{background:#25446b;color:#fff;}
.wkbadge{display:inline-block;background:#25446b;color:#fff;font-size:10px;padding:1px 7px;border-radius:3px;margin-left:6px;}
.wkbadge.prev{background:#8b95a1;}

#tip{position:fixed;z-index:999;background:rgba(21,32,43,.96);color:#fff;font-size:11px;line-height:1.5;
 padding:5px 9px;border-radius:3px;pointer-events:none;display:none;white-space:pre;max-width:320px;
 box-shadow:0 2px 8px rgba(0,0,0,.25);}
svg [data-tip]{cursor:crosshair;}
.hd{grid-column:1/-1;} .hd .judge{font-size:11px;color:var(--ink2);line-height:1.6;margin-top:2px;}
.foot{color:var(--mut);font-size:10px;line-height:1.7;margin-top:10px;border-top:1px solid var(--line);padding-top:7px;}
.foot b{color:var(--ink2);}
.placeholder{background:var(--card);border:1px dashed var(--line);padding:40px;text-align:center;color:var(--mut);font-size:12px;}
svg text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
@media print{ .side,.topbar{display:none;} .main{margin-left:0;} .export-page{page-break-after:always;border:none;} }

.pcb{display:inline-block;width:38px;height:6px;background:#e7ecf1;border-radius:3px;margin-right:4px;vertical-align:middle}
.pcb i{display:block;height:6px;background:#3a6ea5;border-radius:3px}
table.grid tr.grp td{background:#f2f6fa;color:#5a6678;font-size:10px;padding:2px 6px}

details.fold{margin-top:8px;border:1px solid var(--line,#cfd6de);border-radius:3px;background:#fff}
details.fold>summary{cursor:pointer;padding:7px 11px;font-size:11.5px;color:#25446b;font-weight:600;
 background:#f2f6fa;border-radius:3px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:before{content:"\25B8 ";color:#8b95a1}
details.fold[open]>summary:before{content:"\25BE ";}
.foldbody{padding:9px 12px 11px;font-size:11px;line-height:1.75;color:#3c4653}
.foldbody p{margin:0 0 5px}
.foldbody table.grid{margin:2px 0 4px}
.foldbody table.grid td{font-size:10.5px;line-height:1.6}

.csub{font-weight:700;color:#25446b;font-size:11.5px;margin:7px 0 3px}
.csub:first-child{margin-top:0}
.cpar{font-size:11px;line-height:1.85;color:#3c4653;margin:2px 0 4px}
.tagx{display:inline-block;background:#eef3f8;color:#4a6fa5;border:1px solid #cfd8e3;
 border-radius:2px;font-size:9.5px;padding:0 4px;margin-right:4px;vertical-align:1px}
.tagx.wait{background:#fdf3e3;color:#9a6b12;border-color:#e6d3ad}

/* ---- 移动端适配（上传时注入） ---- */
@media(max-width:860px){
  .side{position:static;width:100%;height:auto;padding:8px 0;}
  .side a{display:inline-block;width:auto;padding:5px 10px;border-left:0;border-bottom:2px solid transparent;}
  .side a.on{border-left:0;border-bottom-color:#3a6ea5;}
  .side .grp{padding:8px 12px 2px;}
  .main{margin-left:0;}
  .topbar{position:static;flex-wrap:wrap;gap:6px;padding:8px 12px;}
  .content{padding:10px 10px 40px;}
  .export-page{max-width:100%;padding:8px 9px;}
  .pg,.pg.g12,.grid2,.grid3{grid-template-columns:1fr !important;}
  .pg.g12 .w5,.pg.g12 .w6,.pg.g12 .w7{grid-column:1/-1 !important;}
  .kpi-row{grid-template-columns:repeat(2,1fr) !important;}
  .page-title,.page-title.big{font-size:15px !important;}
  table.grid,table.vt,table{font-size:10.5px !important;}
  td,th{white-space:normal !important;}
  .wrap{padding:10px 10px 30px;}
  svg{max-width:100%;height:auto;}
  div[style*="overflow:auto"],.tscroll{-webkit-overflow-scrolling:touch;}
}
@media(max-width:520px){
  .kpi-row{grid-template-columns:1fr !important;}
  table.grid,table.vt,table{font-size:10px !important;}
}
</style></head>

对发达市场货币，并继续把新兴市场高息货币carry当作超额收益来源（JPM 观点）。系统化框架转为温和做多美元，理由是外汇隐含波动率自7月低位重新定价、高能源价格有利于周期性较弱的出口国（JPM 外汇量化）。买入6个月美元兑日元下跌与日元20年期TONAR下跌的双数字期权，等日央行会议后的回撤再加日元多头（CITI 宏观策略）。会前仍站在日元多头一边，关键风险是日央行的反对票，会上已经兑现（BofA 外汇）","logic":"日元过去两个月的升值建立在日央行更快加息的猜测上，而高市政府提名的两位委员投下反对票，说明后续加息的决策门槛在抬高（GS 外汇、华泰）。更持久的日元升值要等GPIF配置调整与回流，把国内债券提到35%、海外债券与股票各20%是合理情形（CITI 宏观策略）。日央行大致每季加息一次的概率仍高，关键看3月会议能否到1.75%，终值大概率不超过2%（CITI 日本利率）。中国持续偏稳的汇率管理也在抑制美元的整体波动（GS 外汇）","diverge":"分歧：①日元还能不能做多，量化框架与carry都转向美元，美国例外论仍然缺席、美元在增长模型里的权重降到负40%（JPM 外汇量化）；等回撤后继续加日元多头，GPIF才是更持久的催化剂（CITI 宏观策略）。②日元贬值是否可被接受，若联储或欧央行10月加息预期升温，贬值可能加速（CITI 日本利率）；日债长端向美债的外溢与本土资金回流会限制贬值空间（JPM 日本量化）","inst":"GS CITI JPM BofA","perf":"美元指数 +1.1"},{"asset":"美股（Equity）","view":"标普500基本持平、纳斯达克上涨0.72%，VIX下跌6.50%，道琼斯下跌1.69%、罗素2000下跌1.50%。联储移走了风险而不是消除风险：能源定通胀、通胀定长端与利率波动，利率波动回落后股指波动跟随回落，股价因此机械性走高（JPM Sales）。盈利层面，二季度标普500每股收益同比增长51%、过去四个季度26%，远期市盈率19倍与十年均值持平，但按趋势盈利计算的估值只在互联网泡沫顶部被超过；另一方面ROE 24%创历史新高，按历史关系对应的远期市盈率在21倍以上（GS 美股策略）。年初至今的资产排序是原油76.1%、全球股票13.1%、美国股票11.6%、现金2.6%（BofA 资金流）","dir":"维持盈利减速而非崩塌的基准，2027与2028年每股收益预测分别为415与460美元、各增长11%（GS 美股策略）。战术上对标普转为谨慎，7521至7620是关键支撑区，跌破先看7175至7244，四季度地板在7000附近；半导体在12362至13047下方形态偏弱（JPM 技术）。周度资金流仍是股票流入793亿美元、现金流出759亿美元（BofA 资金流）","logic":"市盈率与利率是倒U型关系，拐点由盈利增速决定，盈利增速20%以上时10年升到6%附近股市或仍能承受，当前利率环境不足以打断上行基调（JPM 股票策略）。轮动暂时缓冲了指数的跌幅，但AI板块依然脆弱，半导体维持负面形态（JPM 技术）。更高的油价路径让去通胀更慢，更紧的政策同时压制2027年增长，实际消费预测由2.1%下调至1.8%（MS 经济）","diverge":"分歧：①盈利能否继续支撑估值，盈利减速不等于崩塌、AI投资的拉动会逐步转为折旧压力（GS 美股策略）；负面季节性开始显现，指数被压向支撑区且半导体形态偏弱（JPM 技术）。②政策风险下降算不算利好，风险被移走之后定价权交还给基本面与能源（JPM Sales）；油价与利率同时抬升会二次传导到通胀，政策要更紧（MS 经济）","inst":"JPM GS BofA MS","perf":"标普500 -0.1"},{"asset":"商品（Commodities）","view":"原油领跌，ICE布油下跌5.24%、INE原油下跌10.44%，取暖油下跌3.14%、焦煤下跌6.18%；贵金属与有色领涨，SHFE白银上涨4.34%、COMEX铜上涨2.42%、LME锌上涨1.99%，白银强于黄金。供应侧修复是主因，9月7日当周中东出口相比战前的缺口收窄至日均100万桶，9月缺口230万桶，而8月平均缺口为700万桶；沙特东西管道停运影响300万桶日的出口预期，海上转运量升至日均660万桶（国君期货 原油）","dir":"本周配置排序是有色偏强、新能源与贵金属中性、能化偏弱、农产品与黑色偏弱；黄金回踩关键位置仍可入场长线配置，白银适合在合适点位卖看跌期权，铂钯维持逢估值下沿布局；十年期国债期货维持区间震荡，建议偏低仓位；有色里铅是唯一偏强品种，能化内部分化（君研观市）。关注沙特经霍尔木兹的出口增量与东西管道的替代运力能否部分恢复（国君期货 原油）。柴油强势的逻辑维持，格局改变需要俄罗斯出口、中东供应、霍尔木兹通航至少一项实质改善（国君期货 原油）","logic":"中国民营炼厂的采购成本已转为严重亏损、多家确定降负，日韩炼厂10至11月原料基本采购到位，美欧炼厂在高利润下推迟约日均140万桶检修，俄罗斯炼厂仍受无人机袭击与产品出口限制（国君期货 原油）。更高的油价路径意味着去通胀更慢，核心PCE预计2026年底3.2%、2027年2.7%（MS 经济）","diverge":"分歧：①地缘溢价是否出清完毕，市场开始押注风险降级，美伊缓和信号出现（国君期货 原油）；能源市场面临供应链扰动的汇合，油价路径整体上移（MS 经济）。②黄金怎么看，加息落地后点阵图偏鹰，金价没有出现利空出尽式反弹，上方受强美元与追加加息预期压制（君研观市）；可信的鹰派联储能压下货币贬值的叙事，但不足以让美元突破夏季高点（BofA 外汇）","inst":"MS BofA","perf":"布油 -5.2 / 黄金 +0.6"},{"asset":"中国资产","view":"8月工业增加值加速至5.2%而社零回落至0.4%，供需缺口继续走阔，统计口径问题可能让缺口比官方数据更大；政策重心放在机器人与半导体等高景气子行业，缺乏全面宽松的紧迫性（GS 中国）。固定资产投资累计同比负7.2%、出口同比25%、M2 7.5%（国信）。港股内部分化明显，恒生指数下跌0.22%而恒生科技上涨1.97%，医疗保健上涨4.10%、能源下跌4.43%、工业下跌3.18%（银河）","dir":"短期震荡偏强，科技成长与部分周期、消费相对占优（华金）；抓住反弹窗口期（东吴）；趋势未破、静候反弹，从赛道贝塔转向现金流质量阿尔法（中银国际）；建议持股过双节（财通）。港股配置逻辑重新审视：恒生指数市盈率10.95倍，处2010年以来63%分位（银河）","logic":"估值挤压幅度已达过去十年估值压缩年份的均值水平，AI重点公司2026年盈利增速预测84.9%，全A情绪回到50%分位以下、双创回到20%至30%分位，缩量50%附近企稳（广发）。生产端景气延续回升，地产链与纺织包装是主要亮点，出口运价连续第四周上涨（国信）。资金面上稳定型外资流入70亿港元、灵活型外资流出276亿港元、港股通流入172亿港元（国信）","diverge":"分歧：①反弹能走多远，四季度进一步杀估值的概率较低，缩量50%附近企稳提高了反弹胜率（广发）；分子端产业景气未见拐点，指数从系统性上行转入震荡分化找阿尔法（中银国际）。②房地产的拖累如何演进，中国已接近典型的30%实际房价跌幅与六年调整周期，但弱就业与仍在下行的租金会拉长调整（GS 中国）；地方财政支出仍待改善（广发）。③港股估值还有没有空间，长线外资与内资流入港股科技较多（国信）；恒生指数风险溢价4.13%已低于三年均值（银河）","inst":"GS","perf":"上证 +0.6 / 恒生 -0.2"},{"asset":"信用债（Credit）","view":"投资级CDX收窄至50.6BP、美国高收益OAS在267BP，利差没有跟随政策利率与长端一起走阔（本组跟踪）。定价变量仍在利率端，10年美债收在5.00%、30年5.33%（JPM 利率预测）。贷款与高收益之间出现结构性分化，新发布的贷款信用压力指标为49%，高于高收益的34%，说明增量压力集中在贷款一侧，两类资产已需要分开看（BofA 贷款）","dir":"久期配置的吸引力在回升：收益率回到长期均值，carry与对进一步上行的缓冲都改善，但相对股票的回报仍取决于现金收益，最优债券权重要同时看相对收益、相对风险与分散化（GS 多资产）。年初至今高收益上涨1.6%而投资级下跌1.4%、政府债下跌2.4%，票息是唯一的正贡献（BofA 资金流）","logic":"利率上行拖累本周高收益总回报负0.65%、月内累计负0.95%，高收益基金连续两周流出（BofA 贷款）。看好AAA的carry，但不认为往资本结构下方走能拿到足够补偿（MS 证券化）","diverge":"分歧：①低评级是不是风险所在，高收益利差周内基本不变在270BP，但CCC月内走阔34BP（BofA 贷款）；投资级CDX收窄、整体利差没有跟随利率走阔（本组跟踪）。②该不该往资本结构下方走，只拿AAA的carry、下沉拿不到足够补偿（MS 证券化）；收益率回到长期均值，债券整体在组合里的吸引力回升（GS 多资产）","inst":"JPM BofA GS MS"}],"perfweek":"2026-09-18"},"srcs":{"2026-09-25":{"美债（Rates）":[{"inst" 署（JPM）。投资支持有时滞，地产与消费偏弱仍约束需求，不能把财政融资改善写成全面复苏。","**大类资产**：美债估值改善尚未转为方向性做多，美元受利差支持；铜供应扰动仍属风险情景，能源配置继续等待实际供给验证。","**观点维度**：1）权益总体中性偏空，美股由中性下调至中性偏空，A股中性，港股中性偏空；2）债券中性，原PCE与FOMC上调条件保留；3）商品中性，能源空仓、铜低配；4）信用中性，短久期高评级优先。","**资产层面**：降低美股风险预算，腾出的额度留在现金；不把外资行对AI的积极判断替代我们事先约定的利率约束。"]}]},{"h":"一、宏观环境","blocks":[{"k":"p","t":"**海外**：美国服务业与制造业PMI走强、核心资本品订单改善，住房仍承受高利率压力（CITI）。能源进入更鹰的政策反应函数，使短期加息定价难以消退；实际政策仍有少于市场定价的空间。12月再加一次（JPM）与2027年中降息（CITI）的预测并非同一时点的相反判断。9月30日PCE修订应区分历史水平与近期增速，修订结果将检验当前紧缩预期是否过强。"},{"k":"p","t":"**国内**：8月公共预算支出同比下降0.1%，9月政府债发行和政策性金融工具投放加快（JPM）。上期外需支撑的判断延续，增量仍集中于AI产业链订单，不能外推为出口行业全面回暖。财政托底增强，但施工、订单与收入回升仍需逐步传导。生产改善线索与消费地产偏弱并存，9月30日PMI重点核对新订单能否跟上生产。关税休战延长降低短期尾部风险，技术与关键矿产约束仍在，会晤不等于增长前景全面上修。"}]},{"h":"二、市场环境判断","blocks":[{"k":"p","t":"1）**利率风险阈值已经越过**。上期约定收益率上破5.05%或标普跌破支撑区，任一成立即下调美股，本期已满足第一条。股价仍有盈利支持，但更高贴现率提高了风险预算约束，先减量再观察。"},{"k":"p","t":"2）**盈利支持决定减风险的方式**。美国权益仍是跨资产首选（JPM），AI配置扩展至工业、电力基础设施（Barclays）。两者说明盈利机会仍在，不能据此撤回自身风险规则；减总量敞口，保留有订单与利润支撑的结构方向。"},{"k":"p","t":"3）**A股与港股继续分开判断**。国产算力具备战术相对优势（HSBC），消费地产行业仍偏弱（MS），属于子行业差异。成交与AI盈利条件尚缺本期可比证据，维持中性并保留下调风险；港股仍受海外利率约束。"},{"k":"p","t":"4）**现货风险与预测目标分开**。铜年末上冲15000美元是供应扰动情景（JPM），不是基准预测；潜在柴油禁运也未实施。两者均不足以直接推翻能源空仓和铜低配。"}]},{"h":"三、数据与策略层","blocks":[{"k":"ul","items":["**市场特征**：本组跟踪资产36涨39跌，美股上涨而A股港股回落，国内国债相对海外占优。权益修复仍有区域差异，能源内部也非同向。","**拥挤度与基差**：铜基金经理净多升至三年99%分位，而基差仍在一年低位，资金看多与现货结构并未同步，不追逐未经兑现的供应风险。","**CFTC**：持仓截至9月22日。十年美债做市商回补空头、长钱减多，五年快钱继续回补；日元快钱减多后仍为净多，上期拥挤方向开始缓解。","**组合与归因**：全天候下跌0.40%，连续四周收负。通胀贡献转正，增长贡献为负，但模型预测仍高于实际收益，回撤主要落在负残差，不能全部归因于已建模宏观因素。","**宏观因子**：增长与海外因子本周转正，流动性仍弱，价格隐含增长改善与资金约束并存，不能直接视为经济实绩。","**QIS**：35只均值正0.10%，最好正1.91%、最差负1.63%。利率波动防御单只领先，权益波动套利分类偏弱，Carry类多数上涨但均值略负。","**限制**：评分与聚类沿用2025年窗口，本期不提供排名；独立状态择时因输入停在6月底暂停。行情按各市场交易日取完整周，均不含9月28日。"]}]},{"h":"四、配置建议","blocks":[{"k":"ul","items":["**权益，中性偏空**：1）美股下调至中性偏空，减量优先于撤出全部AI结构机会；2）A股中性，不追高，成交与AI盈利按原条件跟踪；3）港股中性偏空，海外利率压力仍在。","**债券，中性**：境内长端相对优于境外，当前不加久期。沿用9月30日核心PCE下修或10月FOMC不加息后境外长端上调至中性偏多的约定；就业用于评估后续增长风险，不作为附加执行条件，未触发之前保留中性久期。","**商品，中性**：能源保持空仓，出口缺口扩大或通航恶化再介入；贵金属不减不 <script>

// ---- 格式化 ----
function fmtPct(v){ if(v===null||v===undefined) return '—'; const s=(v>0?'+':'')+v.toFixed(2)+'%'; return s; }
function cls(v){ return v>0?'up':(v<0?'dn':'flat'); }
function arrow(v){ return v>0?'▲':(v<0?'▼':'—'); }

// ---- 内联SVG 横向条形图（涨红跌绿，零线居中） ----
function barH(items, opt){
  opt=opt||{}; const w=opt.w||440, rh=opt.rh||16, pad=opt.pad||{l:110,r:46,t:6,b:6};
  const n=items.length, h=pad.t+pad.b+n*rh;
  const vals=items.map(d=>d.v).filter(v=>v!==null);
  const mx=Math.max(0.01, Math.max(...vals.map(Math.abs)));
  const cx=pad.l+(w-pad.l-pad.r)*0.5; const half=(w-pad.l-pad.r)*0.5;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-height:${h}px">`;
  s+=`<line x1="${cx}" y1="${pad.t}" x2="${cx}" y2="${h-pad.b}" stroke="#c2ccd6" stroke-width="1"/>`;
  items.forEach((d,i)=>{
    const y=pad.t+i*rh, v=d.v||0, len=Math.abs(v)/mx*half;
    const col=d.col||(v>0?'#bf262c':(v<0?'#0d7346':'#8b95a1'));
    const x=v>=0?cx:cx-len;
    s+=`<rect x="${x}" y="${y+2}" width="${Math.max(len,0.5)}" height="${rh-4}" fill="${col}" opacity="0.88" data-tip="${d.name} ${fmtPct(v)}"></rect>`;
    s+=`<text x="${pad.l-6}" y="${y+rh/2+3}" text-anchor="end" font-size="9" fill="#465360">${d.name}</text>`;
    s+=`<text x="${v>=0?cx+len+4:cx-len-4}" y="${y+rh/2+3}" text-anchor="${v>=0?'start':'end'}" font-size="9" fill="${col}" font-weight="600">${fmtPct(v)}</text>`;
  });
  s+=`</svg>`; return s;
}

// ---- 分类色(固定顺序，dataviz 口径) ----
const CLR=['#3a6ea5','#c77b16','#0e8a8a','#7a5195','#2f8f4e','#bc5090','#8a6d3b','#4b6584','#9e1f22'];

const CATC={'股指':'#2f6fb5','权益':'#2f6fb5','固收':'#b03a3f','债券':'#b03a3f','外汇':'#7a5195','商品':'#c77b16','其他':'#8b95a1'};
function catColOf(c){return CATC[c]||'#8b95a1';}

// ---- 分组竖柱(每个分类若干根，用于 涨/跌/净 三者并列) ----
function barGroup(cats,defs,opt){
  opt=opt||{};const w=opt.w||560,h=opt.h||210,pad={l:34,r:10,t:16,b:34};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,n=cats.length,m=defs.length;
  let all=[];cats.forEach(c=>defs.forEach(d=>{const v=d.get(c);if(v!=null)all.push(v);}));
  if(!all.length) return '<div class="muted">无数据</div>';
  let mx=Math.max(...all,0),mn=Math.min(...all,0);const p=(mx-mn)*0.12||1;mx+=p;mn-=(mn<0?p:0);
  const Y=v=>pad.t+ih*(1-(v-mn)/(mx-mn));
  const gap=iw/n,bw=Math.min((gap*0.76)/m,26);
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-height:${h}px">`;
  for(let g=0;g<=3;g++){const v=mn+(mx-mn)*g/3,y=Y(v);
    s+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#eef1f4"/>`;
    s+=`<text x="${pad.l-4}" y="${y+3}" text-anchor="end" font-size="8.5" fill="#8b95a1">${v.toFixed(0)}</text>`;}
  s+=`<line x1="${pad.l}" y1="${Y(0)}" x2="${w-pad.r}" y2="${Y(0)}" stroke="#c2ccd6"/>`;
  cats.forEach((c,i)=>{
    const x0=pad.l+gap*i+(gap-bw*m)/2;
    defs.forEach((d,j)=>{const v=d.get(c);if(v==null)return;
      const x=x0+j*bw,y=Y(v),yb=Y(0),col=(typeof d.col==='function'?d.col(c,v):d.col);
      s+=`<rect x="${x+1}" y="${Math.min(y,yb)}" width="${bw-2}" height="${Math.max(Math.abs(y-yb),1)}" fill="${col}" opacity="0.9" data-tip="${c} ${d.name} ${v}"></rect>`;
      s+=`<text x="${x+bw/2}" y="${v>=0?y-2.5:y+9}" text-anchor="middle" font-size="8" fill="${col}" font-weight="600">${v}</text>`;});
    s+=`<text x="${pad.l+gap*i+gap/2}" y="${h-pad.b+14}" text-anchor="middle" font-size="9" font-weight="700" fill="${catColOf(c)}">${c}</text>`;});
  s+=`</svg><div style="font-size:10px;color:#465360;margin-top:2px">`+
     defs.map(d=>`<span style="margin-right:12px"><span style="display:inline-block;width:9px;height:9px;background:${typeof d.col==='function'?d.col(cats[0],1):d.col};margin-right:3px;vertical-align:middle"></span>${d.name}</span>`).join('')+`</div>`;
  return s;

  opt=opt||{}; const w=opt.w||620,h=opt.h||230,pad={l:46,r:opt.r||70,t:10,b:22};

// ---- 内联SVG 散点(x=波动 y=涨跌 色=簇) ----

// ---- 双轴折线(左轴深蓝/右轴橙) ----
function lineChart2(dates,left,right,opt){
  opt=opt||{};const w=opt.w||450,h=opt.h||210,pad={l:opt.l||48,r:opt.r||50,t:20,b:24};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,n=dates.length;

    s+=`<text x="${w-pad.r+4}" y="${y+3}" text-anchor="start" font-size="8.5" fill="${CR}">${rv.toFixed(dr2)}</text>`;}
  s+=`<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${h-pad.b}" stroke="${CL}" stroke-opacity="0.5"/>`;
  s+=`<line x1="${w-pad.r}" y1="${pad.t}" x2="${w-pad.r}" y2="${h-pad.b}" stroke="${CR}" stroke-opacity="0.5"/>`;
  function dr(se,Y,c,dash){if(!se||!se.vals)return'';let d='',st=false;se.vals.forEach((v,i)=>{if(v==null){st=false;return;}d+=(st?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';st=true;});
    return d?`<path d="${d}" fill="none" stroke="${c}" stroke-width="1.6"${dash?' stroke-dasharray="4 2.5"':''}/>`:'';}
  s+=dr(left,YL,CL,false)+dr(right,YR,CR,true);
  const lv=[...(left.vals||[])].reverse().find(v=>v!=null),rv=[...(right.vals||[])].reverse().find(v=>v!=null);

  s+=`<rect x="${w-pad.r-9}" y="2" width="9" height="9" fill="${CR}"/><text x="${w-pad.r-13}" y="10" text-anchor="end" font-size="8.5" fill="${CR}">${right.name} 右轴 ${rv!=null?rv.toFixed(dr2):'—'}（${rn}点，虚线）</text>`;

// ---- 堆叠面积(左轴)+解释度线(右轴) ----
function areaLine(dates,area,r2,opt){
  opt=opt||{};const w=opt.w||450,h=opt.h||225,pad={l:32,r:36,t:12,b:20};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,n=dates.length;
  let mx=0,mn=0;for(let i=0;i<n;i++){let ps=0,ns=0;area.forEach(se=>{const v=se.vals[i]||0;v>=0?ps+=v:ns+=v;});mx=Math.max(mx,ps);mn=Math.min(mn,ns);}if(mx===mn)mx=1;
  const X=i=>pad.l+iw*(n<=1?0:i/(n-1)),Y=v=>pad.t+ih*(1-(v-mn)/(mx-mn));
  const ra=r2.filter(v=>v!=null);let r2mn=ra.length?Math.min(...ra):0,r2mx=ra.length?Math.max(...ra):1;if(r2mn===r2mx){r2mn-=1;r2mx+=1;}
  const YR=v=>pad.t+ih*(1-(v-r2mn)/(r2mx-r2mn));
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-height:${h}px">`;
  s+=`<line x1="${pad.l}" y1="${Y(0)}" x2="${w-pad.r}" y2="${Y(0)}" stroke="#c2ccd6"/>`;
  const pb=new Array(n).fill(0),nb=new Array(n).fill(0);
  area.forEach((se,si)=>{const c=CLR[si%CLR.length];let top=[],bot=[];
    for(let i=0;i<n;i++){const v=se.vals[i]||0;let b,t;if(v>=0){b=pb[i];t=pb[i]+v;pb[i]=t;}else{t=nb[i];b=nb[i]+v;nb[i]=b;}top.push([i,t]);bot.push([i,b]);}
    let d='M'+top.map(([i,y])=>X(i).toFixed(1)+' '+Y(y).toFixed(1)).join(' L')+' L'+bot.reverse().map(([i,y])=>X(i).toFixed(1)+' '+Y(y).toFixed(1)).join(' L')+' Z';
    s+=`<path d="${d}" fill="${c}" fill-opacity="0.5" data-tip="${se.name}"></path>`;});
  let d='',st=false;r2.forEach((v,i)=>{if(v==null)return;d+=(st?'L':'M')+X(i).toFixed(1)+' '+YR(v).toFixed(1)+' ';st=true;});
  s+=`<path d="${d}" fill="none" stroke="#152029" stroke-width="1.6"/>`;
  s+=`<text x="${w-pad.r}" y="9" text-anchor="end" font-size="8" fill="#152029">R²·右</text>`;
  area.forEach((se,si)=>{s+=`<text x="${pad.l+si*48}" y="9" font-size="8" fill="${CLR[si%CLR.length]}">${se.name}</text>`;});
  [0,Math.floor(n/2),n-1].forEach(i=>{if(i>=0&&i<n)s+=`<text x="${X(i)}" y="${h-5}" text-anchor="middle" font-size="8" fill="#8b95a1">${(dates[i]||'').slice(2)}</text>`;});
  return s+`</svg>`;
}

function scoreTable(rows){
  const sorted=[...rows].filter(r=>r.mom!==null).sort((a,b)=>b.mom-a.mom);
  const sc=sorted.map(r=>r.score).filter(v=>v!=null);
  const smx=sc.length?Math.max(...sc):1,smn=sc.length?Math.min(...sc):0;
  const md=sorted.map(r=>r.mid).filter(v=>v!=null);
  const mmx=md.length?Math.max(...md):100,mmn=md.length?Math.min(...md):0;
  let h=`<div style="overflow:auto;max-height:520px"><table class="grid"><thead><tr><th>#</th><th>资产</th><th>类别</th><th>周涨跌</th><th>短期动量</th><th>中期动量</th><th>总分</th><th>簇</th></tr></thead><tbody>`;
  sorted.forEach((r,i)=>{
    const a=r.mom==null?0:Math.min(Math.max(r.mom,0),1);
    const bg=`background:rgba(37,68,107,${(a*0.5).toFixed(2)});color:${a>0.55?'#fff':'#152029'}`;
    const sa=(r.score==null||smx===smn)?0:(r.score-smn)/(smx-smn);
    const sbg=r.score==null?'':`background:rgba(199,123,22,${(sa*0.62).toFixed(2)})`;
    const ma=(r.mid==null||mmx===mmn)?0:(r.mid-mmn)/(mmx-mmn);
    const mbg=r.mid==null?'':`background:rgba(14,138,138,${(ma*0.45).toFixed(2)})`;
    h+=`<tr><td class="muted">${i+1}</td><td class="sym" style="color:${clsColOf(r.cls)}">${r.name}</td><td class="muted" style="color:${clsColOf(r.cls)}">${r.cls}</td><td class="${cls(r.chg)}">${r.chg==null?'—':fmtPct(r.chg)}</td><td style="${bg}">${r.mom==null?'—':r.mom.toFixed(3)}</td><td style="${mbg}">${r.mid==null?'—':(r.mid).toFixed(1)}</td><td class="hl" style="${sbg}">${r.score==null?'—':r.score.toFixed(2)}</td><td class="muted">${r.km==null?'':r.km}</td></tr>`;});
  return h+`</tbody></table></div>`;
}

      <tr><td>Disaggregated（商品）</td><td>生产商贸易商 ／ 互换交易商 ／ 基金经理 ／ 其他</td><td>原油、黄金、铜用它</td></tr>
    </tbody></table>

    <p style="margin-top:8px"><b>二、非商业是怎么拆开的，从原始表怎么算出来。</b>
    同一批合约 CFTC 发三套报告，人群划分方式不同：</p>
    <table class="grid"><thead><tr><th style="width:150px">这一侧的人是谁</th>
      <th style="width:150px">老口径 Legacy</th><th style="width:220px">金融期货 TFF</th>
      <th>商品 Disaggregated</th></tr></thead><tbody>
      <tr><td>有现货、用期货套保</td><td>商业 Commercial</td><td>交易商 Dealer／Intermediary</td>
        <td>生产商贸易商加工商用户 ＋ 互换交易商</td></tr>
      <tr><td><b>没有现货、纯做方向</b></td><td><b>非商业 Non-Commercial</b></td>
        <td><b>资产管理 Asset Manager ＋ 杠杆基金 Leveraged Funds</b></td>
        <td><b>基金经理 Money Manager</b></td></tr>
      <tr><td>其余</td><td>非报告 Non-reportable</td><td>其他可报告 ＋ 非报告</td><td>其他可报告 ＋ 非报告</td></tr>
    </tbody></table>
    <p>媒体常引的「非商业净多头」就是<b>左列</b>那一格。本页不用它，因为它把配置盘与投机盘压成一格。
    中列与右列是把这一格拆开之后的版本：<b>长钱</b>＝资产管理，官方定义为养老金、捐赠基金、保险、共同基金等以配置为目的的机构，换手低；
    <b>快钱</b>＝杠杆基金（商品里叫基金经理），即对冲基金与各类 CTA，做趋势与相对价值。
    两者在老口径下都算非商业，但换手频率与持仓意图完全不同，合在一起看会把配置意图与趋势交易混掉，这就是我们拆开的理由。</p>

    <p><b>净持仓怎么算。</b>每一栏都是该类别的多头张数减空头张数，由官方两个原始字段直接相减，我们不做任何加权或调整：</p>
    <table class="grid"><thead><tr><th style="width:120px">本页叫法</th><th>计算式（官方原始字段）</th></tr></thead><tbody>
      <tr><td><b>长钱</b></td><td><code>asset_mgr_positions_long − asset_mgr_positions_short</code></td></tr>
      <tr><td><b>快钱</b>（金融期货）</td><td><code>lev_money_positions_long − lev_money_positions_short</code></td></tr>
      <tr><td><b>快钱</b>（商品）</td><td><code>m_money_positions_long_all − m_money_positions_short_all</code></td></tr>
      <tr><td><b>做市商</b></td><td><code>dealer_positions_long_all − dealer_positions_short_all</code></td></tr>
      <tr><td><b>产业套保</b></td><td><code>prod_merc_positions_long − prod_merc_positions_short</code></td></tr>
      <tr><td><b>互换商</b></td><td><code>swap_positions_long_all − swap__positions_short_all</code>（双下划线是数据源真实拼写）</td></tr>
    </tbody></table>

    <p><b>有两件事必须知道。</b>其一，<b>三套报告的分类不能相加还原</b>：Legacy 的商业不等于 Disaggregated 的生产商贸易商加互换商，
    官方也不建议这样对应，所以拿本页数字去核对媒体引的「非商业」一定对不上，那是口径不同不是数据错。
    其二，<b>本页只展示上表这几栏，没有展示「其他可报告」与「非报告小户」</b>，
    因此同一合约各腿加总不等于零、也不等于未平仓量，差额就落在这两类里。
    本期美债 10 年三腿合计减约 3.8 万张，就是被它们净接走的。</p>
<p style="margin-top:8px"><b>三、字段映射。</b>净持仓＝该类别多头张数减空头张数，由官方原始字段直接相减得到：</p>
    <table class="grid"><thead><tr><th style="width:120px">本页叫法</th><th style="width:190px">官方分类</th>
      <th style="width:230px">原始字段</th><th>我们这样理解的依据</th></tr></thead><tbody>
      <tr><td><b>长钱</b></td><td>Asset Manager／Institutional（TFF）</td>
        <td>asset_mgr_positions_long ／ _short</td>
        <td>官方定义为养老金、捐赠基金、保险、共同基金等以配置为目的的机构，换手低，方向变化代表配置意图</td></tr>
      <tr><td><b>快钱</b>（金融期货）</td><td>Leveraged Funds（TFF）</td>
        <td>lev_money_positions_long ／ _short</td>
        <td>官方定义为对冲基金与各类 CTA，通常做趋势与相对价值，是短周期方向的主要承担者</td></tr>
      <tr><td><b>快钱</b>（商品）</td><td>Money Manager（Disaggregated）</td>
        <td>m_money_positions_long_all ／ _short_all</td>
        <td>商品报告里对应的投机方向盘，功能上与上一行相近，<b>但属于另一套分类，绝对值不可与上一行相比</b></td></tr>
      <tr><td><b>做市商</b></td><td>Dealer／Intermediary（TFF）</td>
        <td>dealer_positions_long_all ／ _short_all</td>
        <td>卖方做市与中介，持仓多为满足客户需求后的残余敞口，常与长钱反向，本身不表达观点</td></tr>
      <tr><td><b>产业套保</b></td><td>Producer／Merchant／Processor／User</td>
        <td>prod_merc_positions_long ／ _short</td>
        <td>有现货敞口的生产与贸易环节，以套保为主，常年净空是经营需要，方向本身不构成看空</td></tr>
      <tr><td><b>互换商</b></td><td>Swap Dealer（Disaggregated）</td>
        <td>swap_positions_long_all ／ swap__positions_short_all</td>
        <td>场外互换的对冲腿，反映的是客户需求的镜像而非自身判断，<b>仅列出不参与解读</b>。
        字段名里两个下划线是官方数据源的真实拼写</td></tr>
    </tbody></table>

    <p style="margin-top:8px"><b>四、为什么两张表不能横着比。</b>同一个合约在两套报告里被切成不同的类别，
    人群划分标准不同、覆盖范围也不同。金融期货的快钱只含杠杆基金，商品的快钱含全部管理资金，
    两者口径不重合。因此本页把两类分成两张表，各自只看方向、周变化与自身历史分位。</p>

    <p><b>五、计算口径。</b>周变化＝本期净持仓减上一期。三年分位＝当前净持仓在最近 156 周同一栏中的百分位，
    五年分位同理取最近 260 周。样本不足 max(30, N/4) 周（三年档 39 周、五年档 65 周）则留空，不用更长历史顶替。
    表内分位列展示的是<b>三年</b>档；鼠标悬停可看五年档，两档口径不同、不要混引。</p>

    <p><b>六、时间口径。</b>CFTC 统计的是每周二收盘持仓，本周五发布，因此报告日 ${C.asof} 反映的是那一天的持仓，
    持仓日期早于其它页面的价格截止日，跨页对照时注意发布时滞。</p>
  </div></details>`;

  h+=`</div>`;
  return h;
}

function renderScore(){
  const S=D.score;
  if(S.status==='historical_inputs')return `<div class="export-page"><div class="hd"><div class="page-title">资产打分与聚类 <span class="sub">本期暂停更新</span></div><div class="judge">${S.note}</div></div><div class="card"><div class="ct">数据有效性说明</div>保留既有计算口径，待评分日期与聚类窗口确认后恢复。本页不提供当期资产排名。</div>${footNote('资产打分与聚类','历史模板待更新','本页无当期有效评分')}</div>`;
  const strong=[...S.mom].sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.name).join('、');
  let h=`<div class="export-page"><div class="hd"><div class="page-title">资产打分与聚类 <span class="sub">风险收益前沿 · 动量象限 · 分类打分 · ${D.meta.asof}</span></div>`;
  h+=`<div class="judge">综合总分靠前：${strong}。散点看性价比（同簇＝风险收益特征相近，点大小＝总分）；动量象限区分「趋势延续」（右上，短中期同向）与「超跌反转」（左上）——领涨落在右上更可持续。</div></div>`;
  h+=`<div class="pg">`;
  h+=`<div class="card"><div class="ct">风险-收益：年化波动 × 本周涨跌（色＝KMeans簇，点大小＝综合总分）</div>${scatterXY(S.scatter.map(a=>({x:a.vol,y:a.chg,r:3+Math.min(Math.max(a.score||0,0)*2.2,8),c:CLR[((a.km||1)-1)%CLR.length],name:a.name})),{w:560,h:330,xlab:'年化波动率%',ylab:'本周涨跌%',y0:true})}</div>`;
  h+=`<div class="card"><div class="ct">动量象限：中期 × 短期动量（右上趋势延续／左上超跌反转，色＝类别）</div>${scatterXY(S.mom.filter(a=>a.mid!=null&&a.short!=null).map(a=>({x:a.mid,y:a.short,r:5,c:clsColOf(a.cls),name:a.name})),{w:560,h:330,xlab:'中期动量',ylab:'短期动量',x0:true,y0:true})}</div>`;
  h+=`</div><div class="pg">`;
  h+=`<div class="card"><div class="ct">动量打分 · 国内（评分热力，名色＝类别）</div>${scoreTable(S.score_dom)}</div>`;
  h+=`<div class="card"><div class="ct">动量打分 · 海外（评分热力，名色＝类别）</div>${scoreTable(S.score_ovs)}</div>`;
  h+=`</div>`+footNote('资产打分与聚类','大类资产聚类 · 打分_国内/海外','散点四维＝波动×周涨跌×簇×总分；动量象限＝短期vs中期');
  return h+`</div>`;
}

function renderPortfolio(){
  const P=D.portfolio,W=P.wk4||{weeks:[],allw:[],frp:[]};
  const lastw=(W.allw||[]).concat(W.frp||[]);
  const best=lastw.filter(x=>x.rets&&x.rets[3]!=null).sort((a,b)=>b.rets[3]-a.rets[3]);
  let h=`<div class="export-page"><div class="hd"><div class="page-title">风险平价与因子组合 <span class="sub">ALLW 风险平价篮子 × FRP 因子组合 · 周频 ${P.dates.length} 点 · ${P.span||''}</span></div>`;
  h+=`<div class="judge">本周最强 ${best.length?best[0].name+' '+fmtPct(best[0].rets[3]):'—'}、最弱 ${best.length?best[best.length-1].name+' '+fmtPct(best[best.length-1].rets[3]):'—'}。左图为宏观象限篮子（全天候与增长/通胀上下行），右图为因子风险平价的四类进攻/防御组合，两者共用同一套底层资产但风险分配方式不同：看哪一象限单独拖累，就能定位本周的宏观方向。</div></div>`;
  // R11 两图一行、时间与数据等长
  h+=`<div class="pg">`;
  h+=`<div class="card"><div class="ct">① 风险平价 ALLW：全天候与宏观象限组合净值（${P.dates.length} 周，${P.span||''}）</div>${lineChart(P.dates,P.allw||[],{w:600,h:280,dec:2,r:76})}</div>`;
  h+=`<div class="card"><div class="ct">② 因子风险平价 FRP：因子进攻/防御组合净值（同期，同起点归一）</div>${lineChart(P.dates,P.frp||[],{w:600,h:280,dec:2,r:76})}</div>`;
  h+=`</div>`;
  // R12 最近4周各周涨跌幅
  const wtab=(rows,title)=>{
    let t=`<div class="card"><div class="ct">${title}：最近 4 周各周涨跌幅 + 全期风险刻画</div><table class="grid"><thead><tr><th>组合</th>`+
      (W.weeks||[]).map(d=>`<th>${d.slice(5)}</th>`).join('')+`<th>年化收益</th><th>年化波动</th><th>最大回撤</th><th>全期累计</th></tr></thead><tbody>`;
    rows.forEach(r=>{t+=`<tr><td class="sym">${r.name}</td>`+
      (r.rets||[]).map(v=>{const a=v==null?0:Math.min(Math.abs(v)/2.5,1);return `<td class="${cls(v)}" style="background:rgba(${v>=0?'191,38,44':'13,115,70'},${(a*0.45).toFixed(2)})">${v==null?'—':fmtPct(v)}</td>`;}).join('')+
      `<td class="${cls(r.cagr)}">${r.cagr==null?'—':r.cagr+'%'}</td><td class="muted">${r.vol==null?'—':r.vol+'%'}</td><td class="dn">${r.mdd==null?'—':r.mdd+'%'}</td><td class="${cls(r.total)} hl">${r.total==null?'—':fmtPct(r.total)}</td></tr>`;});
    return t+`</tbody></table></div>`;};
  h+=`<div class="pg">`+wtab(W.allw||[],'ALLW 风险平价篮子')+wtab(W.frp||[],'FRP 因子组合')+`</div>`;
  // 近4周涨跌横向对比（同一坐标）
  h+=`<div class="pg">`;
  h+=`<div class="card"><div class="ct">本周（${(W.weeks||[]).slice(-1)[0]||''}）各组合涨跌幅对比（ALLW 蓝标／FRP 橙标）</div>${barH(lastw.filter(x=>x.rets&&x.rets[3]!=null).sort((a,b)=>b.rets[3]-a.rets[3]).map(x=>({name:x.name,v:x.rets[3]})),{w:560,rh:17})}</div>`;
  h+=`<div class="card"><div class="ct">近 4 周累计涨跌幅（连乘，看方向是否持续而非单周脉冲）</div>${barH(lastw.map(x=>{const rs=(x.rets||[]).filter(v=>v!=null);const cum=rs.reduce((a,v)=>a*(1+v/100),1);return {name:x.name,v:+((cum-1)*100).toFixed(2)};}).sort((a,b)=>b.v-a.v),{w:560,rh:17})}</div>`;
  h+=`</div>`;
  h+=footNote('风险平价与因子组合','组合变化（'+(P.n_raw||0)+' 个交易日，2016 起）','净值按每 ISO 周最后交易日取样；周涨跌幅＝相邻周净值比−1；年化波动＝周收益标准差×√52');
  return h+`</div>`;
}

function renderVol(){
  const V=D.vol,B=D.basis,K=V.keyday||{dates:[],sh:[],prop:[]},HV=V.hv||{dates:[],groups:[],avg:{dates:[],series:[]}};
  const nowprop=V.stress&&V.stress.prop&&V.stress.prop.length?V.stress.prop[V.stress.prop.length-1]:null;
  const kp=K.prop||[],kn=kp.length;
  const kNow=kn?kp[kn-1]:null;
  const sortedk=[...kp].filter(v=>v!=null).sort((a,b)=>a-b);
  const kRank=(kNow!=null&&sortedk.length)?Math.round(sortedk.filter(v=>v<=kNow).length/sortedk.length*100):null;
  let h=`<div class="export-page"><div class="hd"><div class="page-title">波动率与市场共振 <span class="sub">关键日长历史双轴 · 应激度 · 价-波背离 · 分大类HV60 · ${V.asof}</span></div>`;
  h+=`<div class="judge">关键日占比当前 ${kNow!=null?kNow.toFixed(1):'—'}%，处于 2001 年以来 ${kRank!=null?kRank:'—'}% 分位；应激度（异动资产占比）约 ${nowprop!=null?nowprop.toFixed(0):'—'}%，本周异动：${V.latest_change||'—'}。关键日占比与上证点位叠看，可分辨这是指数级系统性冲击还是局部品种异动。价-波背离图中「涨+低波」＝健康上涨、「跌+高波」＝承压出清。</div></div>`;
  // R4 关键日大图：全宽双轴、时间尽量长
  h+=`<div class="card"><div class="ct">市场关键日：上证指数点位（左轴，实线）× 关键日占比%（右轴，虚线）　${K.span||''}　共 ${K.n_raw||kn} 个交易日、图上 ${kn} 点</div>${lineChart2(K.dates||[],{name:'上证指数',vals:K.sh||[]},{name:'关键日占比%',vals:kp},{w:1240,h:300,dl:0,dr:1,ticks:10,l:56,r:56})}</div>`;
  h+=`<div class="pg">`;
  h+=`<div class="card"><div class="ct">市场应激度：异动资产占比时序（越高＝越多资产同日异动＝系统性共振）</div>${lineChart((V.stress||{}).dates||[],[{name:'异动占比%',vals:(V.stress||{}).prop||[]}],{w:600,h:235,dec:0})}</div>`;
  h+=`<div class="card"><div class="ct">价-波背离：价格σ × 波动历史分位（右下健康／左上承压，色＝大类）</div>${scatterXY((V.diverge||[]).map(a=>({x:a.sig,y:a.pct,r:4,c:catColOf(a.cat),name:a.name})),{w:600,h:265,xlab:'价格σ(标准化涨幅)',ylab:'波动历史分位',x0:true})}</div>`;
  h+=`</div>`;
  // R6 分大类 HV60 折线（2x2）+ 大类平均 HV 长历史
  if(HV.groups&&HV.groups.length){
    h+=`<div class="sec">分大类 HV60 走势（近3年周频，${(HV.dates||[]).length} 点；替代原横向分位柱）</div><div class="pg">`;
    HV.groups.forEach(g=>{h+=`<div class="card"><div class="ct" style="color:${catColOf(g.cat)}">${g.cat} · HV60 年化波动率%（${g.series.length} 个代表品种）</div>${lineChart(HV.dates,g.series,{w:600,h:215,dec:0,r:88})}</div>`;});
    h+=`</div>`;
  }
  if(HV.avg&&HV.avg.series&&HV.avg.series.length){
    h+=`<div class="card"><div class="ct">大类平均 HV60（各大类全部成分等权平均，全历史周频 ${HV.avg.dates.length} 点 · ${HV.span||''}）</div>${lineChart(HV.avg.dates,HV.avg.series.map(s=>({name:s.name,vals:s.vals})),{w:1240,h:250,dec:0,r:74,cols:HV.avg.series.map(s=>catColOf(s.name))})}</div>`;
  }
  // R5 分位表：分大类 + 具体品种
  h+=`<div class="sec">波动率历史分位（口径 ${V.pct_basis||'HV60'}；分位＝当前 HV60 在自身历史中的百分位）</div><div class="pg g12">`;
  const PG=V.pct_groups||[];
  h+=`<div class="card w7"><div class="ct">分大类 · 分品种 HV60 与历史分位（红＝分位高／偏极端，边际＝分位周内变化）</div><div style="overflow:auto;max-height:460px"><table class="grid"><thead><tr><th style="text-align:left">大类 / 品种</th><th>HV60</th><th>历史分位</th><th>边际</th></tr></thead><tbody>`;

function renderAttr(){
  const A=D.attribution,FC=['增长','通胀','利率','境外'];
  const fcol={'增长':'#3a6ea5','通胀':'#c77b16','利率':'#b03a3f','境外':'#7a5195'};
  const one=(g,t)=>`<div class="card"><div class="ct">${t}　风险贡献占比堆叠 + 宏观解释度R²(右轴黑线) <b>${g.latest.R2}%</b>　增长${g.latest['增长']} 通胀${g.latest['通胀']} 利率${g.latest['利率']} 境外${g.latest['境外']}</div>${areaLine(g.dates,g.rc,g.r2,{w:600,h:250})}</div>`;
  const rone=(g,t)=>{const rr=(g.retc13&&g.retc13.length?g.retc13:g.retc);
    const lat=rr.map(s=>{const v=[...s.vals].reverse().find(x=>x!=null);return s.name+' '+(v==null?'—':(v>0?'+':'')+v.toFixed(2));}).join('　');
    return `<div class="card"><div class="ct">${t}　收益贡献堆叠（13周滚动累计 %，正负分列）+ 解释方差占比(右轴黑线)　${lat}</div>${areaLine(g.dates,rr,g.vsf||g.r2,{w:600,h:230})}</div>`;};
  const bone=(g,t)=>{const bs=(g.beta_s||[]).map(s=>{const v=s.vals.filter(x=>x!=null);
      const m=v.length?v.reduce((a,b)=>a+b,0)/v.length:0;
      const sd=v.length>1?Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(v.length-1)):1;
      const lv=[...s.vals].reverse().find(x=>x!=null);
      return {name:s.name+(lv==null?'':' '+lv.toFixed(2)),vals:s.vals.map(x=>x==null?null:+((x-m)/(sd||1)).toFixed(3))};});
    const raw=(g.beta_s||[]).map(s=>{const lv=[...s.vals].reverse().find(x=>x!=null);return s.name+' '+(lv==null?'—':lv.toFixed(2));}).join('　');
    return `<div class="card"><div class="ct">${t}　四因子 beta 走势（各自 z-score 后同图可比，图例数字＝最新原始 beta）　原始值 ${raw}</div>${lineChart(g.dates,bs,{w:600,h:230,dec:1,r:78,cols:(g.beta_s||[]).map(s=>fcol[s.name]||'#8b95a1')})}</div>`;};
  const wtab=(g,t)=>{
    let s=`<div class="card"><div class="ct">${t}　最近 4 期收益贡献分解（%，实际＝预测+残差；alpha 为截距项）</div><table class="grid"><thead><tr><th>日期</th>`+
      FC.map(f=>`<th style="color:${fcol[f]}">${f}</th>`).join('')+`<th>alpha</th><th>模型预测</th><th>残差</th><th>实际收益</th></tr></thead><tbody>`;
    (g.wk||[]).slice().reverse().forEach(r=>{s+=`<tr><td class="sym">${r.date}</td>`+
      FC.map(f=>`<td class="${cls(r[f])}">${r[f]==null?'—':fmtPct(r[f])}</td>`).join('')+
      `<td class="${cls(r.alpha)}">${r.alpha==null?'—':fmtPct(r.alpha)}</td><td class="${cls(r.pred)}">${r.pred==null?'—':fmtPct(r.pred)}</td><td class="${cls(r.resid)}">${r.resid==null?'—':fmtPct(r.resid)}</td><td class="${cls(r.ret)} hl">${r.ret==null?'—':fmtPct(r.ret)}</td></tr>`;});
    return s+`</tbody></table></div>`;};
  const lr=A.allw.wk&&A.allw.wk.length?A.allw.wk[A.allw.wk.length-1]:{};
  const drv=FC.filter(f=>lr[f]!=null).sort((a,b)=>Math.abs(lr[b])-Math.abs(lr[a]))[0];
  let h=`<div class="export-page"><div class="hd"><div class="page-title">组合归因 <span class="sub">风险贡献 · 收益贡献 · 因子beta · 近4期分解 · ${D.meta.asof}</span></div>`;
  h+=`<div class="judge">ALLW 宏观解释度 ${A.allw.latest.R2}%、FRP ${A.frp.latest.R2}%，解释度越高说明收益越由宏观因子决定、特质收益越少。本周 ALLW 收益的主导因子是 ${drv||'—'}（贡献 ${drv&&lr[drv]!=null?fmtPct(lr[drv]):'—'}），残差 ${lr.resid==null?'—':fmtPct(lr.resid)} 表示模型之外的部分。风险贡献看的是方差分配、收益贡献看的是当期损益，两者背离时说明暴露在赚钱但不是主要风险来源。</div></div>`;
  h+=`<div class="pg">${one(A.allw,'全天候 ALLW')}${one(A.frp,'风险中性组合（FRP表）')}</div>`;
  h+=`<div class="pg">${rone(A.allw,'ALLW')}${rone(A.frp,'风险中性组合')}</div>`;
  h+=`<div class="pg">${bone(A.allw,'ALLW')}${bone(A.frp,'风险中性组合')}</div>`;
  h+=`<div class="pg">${wtab(A.allw,'ALLW')}${wtab(A.frp,'风险中性组合')}</div>`;
  h+=footNote('组合归因','ALLW · FRP（34/35 列全量字段）','风险贡献＝var_rc_share；收益贡献＝ret_contrib；beta＝滚动回归暴露；R²＝rolling_R2');
  return h+`</div>`;
}

// 1.1 本期结论
function renderConclusion(){
  const C=D.conclusion||{};
  if(!C.secs||!C.secs.length) return `<div class="export-page"><div class="page-title big">本期结论</div>
    <div class="judge">未读到 &lt;周&gt;\本期结论.md，请先生成底稿再刷新。</div></div>`;
  // md 行内标记 → HTML；【人工…】只是底稿标注，不上网页
  const md=t=>String(t)
    // 先把包着标记的整段粗体换成小徽标，否则剥完只剩裸露的 ****
    .replace(/\*{0,2}【我方跟踪[^】]*】\*{0,2}/g,'<span class="tagx">我方跟踪</span>')
    .replace(/\*{0,2}【人工[^】]*待你写[^】]*】\*{0,2}/g,'<span class="tagx wait">待填</span>')
    .replace(/\*{0,2}【人工[^】]*】\*{0,2}/g,'<span class="tagx">人工</span>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
  const blocks=bs=>bs.map(b=>{
    if(b.k==='sub') return `<div class="csub">${md(b.t)}</div>`;
    if(b.k==='p')   return `<div class="cpar">${md(b.t)}</div>`;
    return `<ul class="lv1">${b.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`;
  }).join('');

  let h=`<div class="export-page"><div class="page-title big">本期结论：${C.title||''}
    <span class="sub" style="font-size:11.5px">本组配置判断 · 底稿 ${C.week} · 行情截止 ${D.meta.asof}</span></div>`;
  const core=C.secs.find(s=>s.h.indexOf('核心结论')>=0);
  const rest=C.secs.filter(s=>s!==core);
  if(core) h+=`<div class="cbox hi"><div class="t">${core.h}</div>${blocks(core.blocks)}</div>`;
  h+=`<div class="pg">`+rest.map(s=>`<div class="cbox"><div class="t">${s.h}</div>${blocks(s.blocks)}</div>`).join('')+`</div>`;
  h+=footNote('本期结论','<周>\\本期结论.md','网页与 PPT 同源，改底稿即改两处；标【人工】的段落不由脚本覆盖');
  h+=`</div>`;
  return h;
}

function pickTable(rows){

      ['index.html','成品网页，数据内联、离线可用'],
      ['build_online.py','抽取各页数据并注入网页'],
      ['build_sources.py','观点溯源、周度表现小库、feed 摘录、两个库页面'],
      ['check_ready.py','五类数据就绪体检'],
      ['研报库.html / 观点库.html','原文索引与可读入口'],
      ['view_sources.json / perf_db.json','溯源映射与周度表现小库'],
      ['观点归纳SOP.md','观点提炼四要素与质量闸门'],
      ['设计规格.md','页面设计与板式规格'],
    ],['184px',''])+`</div></div>`;

  h+=`<div class="cbox full"><div class="t">质量校验与已知口径</div><ul class="lv1">
    <li>三重验证：脚本语法检查、逐页渲染检查（无异常值与报错）、链接可达性检查。</li>
    <li>溯源匹配不到出处时留空，不做推测；数据源缺失项留空并在页面标注。</li>
    <li>源表多为最新在上，取数需先按日期升序再取最新区间；基差已为百分数不再换算。</li>
    <li>基差与 QIS 两个底稿若未单独刷新，相关页面日期会落后于主表，体检会点名。</li>
  </ul></div>`;
  h+=footNote('更新说明','全流程说明','数据层随底稿刷新，观点与研判层每周由 AI 重写');
  return h+`</div>`;
}

// ---- 脚注 ----
function footNote(page, sheets, note){
  return `<div class="foot"><b>数据来源</b>：周报指标.xlsx及独立来源（${sheets}）　·　<b>行情截止日期</b>：${D.meta.asof}　·　<b>页面生成时间</b>：${D.meta.generated}　·　${note||''}<br>各市场保留实际交易日；独立数据日期以本页标注为准，暂停项不视为本期更新。</div>`;
}

const PAGES={
  p_conclusion:{render:renderConclusion}, p_view:{render:renderView}, p_report:{render:renderReport},
  p_weekly:{render:renderWeekly}, p_vol:{render:renderVol}, p_corr:{render:renderCorr}, p_score:{render:renderScore}, p_cftc:{render:renderCftc},
  p_rp:{render:renderPortfolio}, p_attr:{render:renderAttr}, p_macro:{render:renderMacro}, p_qis:{render:renderQis}, p_howto:{render:renderHowto},
};
if(D.meta.update_mode==='data_only'){
  ['p_conclusion','p_view','p_report'].forEach(id=>{
    const original=PAGES[id].render;
    PAGES[id].render=()=>original().replace('<div class="export-page">',
      `<div class="export-page"><div class="judge">行情已更新至${D.meta.asof}；本页观点与研报保留${D.meta.view_asof}版本，待新材料更新。</div>`);
  });
}
// 周档研判与数据一起注入，网页和逐页PPT导出共用，避免只刷新数字而遗留旧判断。
Object.entries(D.page_notes||{}).forEach(([id,note])=>{
  if(!PAGES[id])return;
  const original=PAGES[id].render;
  const safe=String(note).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  PAGES[id].render=()=>original().replace(/<div class="judge">[\s\S]*?<\/div>/,()=>`<div class="judge">${safe}</div>`);
});
function showPage(id){
  document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on', a.dataset.page===id));
  const p=PAGES[id];
  $('content').innerHTML = p ? p.render() : `<div class="placeholder">「${document.querySelector('.side a[data-page="'+id+'"]').textContent.replace('待建','').trim()}」页 · 待建（阶段2接入）</div>`;
  window.scrollTo(0,0);
}
// ---- 一键导出 PPT（逐页渲染→html-to-image 截图→PptxGenJS 每页一图，4:3） ----
async function exportPPT(ev){
  if(typeof PptxGenJS==='undefined'||typeof htmlToImage==='undefined'){alert('导出库未加载：请确认同目录 lib/ 下有 html-to-image.js 与 pptxgen.bundle.js');return;}
  const btn=ev&&ev.target; if(btn){btn.textContent='导出中…';btn.disabled=true;}
  const pptx=new PptxGenJS(); pptx.defineLayout({name:'W43',width:10,height:7.5}); pptx.layout='W43';
  const host=$('content'); const cur=document.querySelector('.side a.on'); const curId=cur?cur.dataset.page:'p_weekly';
  for(const id of Object.keys(PAGES)){
    host.innerHTML=PAGES[id].render();
    const el=host.querySelector('.export-page'); if(!el) continue;
    await new Promise(r=>setTimeout(r,60));
    try{
      const url=await htmlToImage.toPng(el,{pixelRatio:2,backgroundColor:'#eef1f4',width:el.scrollWidth,height:el.scrollHeight});
      const iw=el.scrollWidth,ih=el.scrollHeight,pw=10,ph=7.5,sc=Math.min(pw/iw,ph/ih),w=iw*sc,h=ih*sc;
      const slide=pptx.addSlide(); slide.background={color:'EEF1F4'};
      slide.addImage({data:url,x:(pw-w)/2,y:(ph-h)/2,w:w,h:h});
    }catch(e){ console.error('导出页失败',id,e); }
  }
  await pptx.writeFile({fileName:'大类资产配置周报_'+(D.meta.asof||'')+'.pptx'});
  showPage(curId); if(btn){btn.textContent='一键导出 PPT';btn.disabled=false;}
}
// ---- 即时 tooltip（跟随鼠标） ----
(function(){
  const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
  document.addEventListener('mousemove',function(e){
    const el=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
    if(el){ tip.textContent=el.getAttribute('data-tip'); tip.style.display='block';
      let x=e.clientX+14,y=e.clientY+14;
      const r=tip.getBoundingClientRect();
      if(x+r.width>window.innerWidth-8)x=e.clientX-r.width-14;
      if(y+r.height>window.innerHeight-8)y=e.clientY-r.height-14;
      tip.style.left=x+'px'; tip.style.top=y+'px';
    } else { tip.style.display='none'; }
  },{passive:true});
  document.addEventListener('mouseleave',()=>{tip.style.display='none';});
})();
function init(){
  if(!D){ $('content').innerHTML='<div class="placeholder">未找到 data.js，请先运行 build_online.py</div>'; return; }
  $('side-asof').textContent='行情截止日期 '+D.meta.asof;
  $('top-meta').textContent='行情截止日期 '+D.meta.asof+'　·　生成 '+D.meta.generated;
  document.querySelectorAll('.side a').forEach(a=>a.onclick=()=>showPage(a.dataset.page));
  showPage((location.hash||'').replace('#','')||'p_weekly');
  window.onhashchange=()=>showPage((location.hash||'').replace('#','')||'p_weekly');
}
init();
</script>
