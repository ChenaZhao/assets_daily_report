;span class=&quot;state-label&quot;&gt;放缓&lt;/span&gt;&lt;span class=&quot;state-meta&quot;&gt;0.39&lt;/span&gt;&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;detail-box&quot; data-detail-box&gt;&lt;/section&gt;&lt;/section&gt;
&lt;details class=&quot;logic-appendix&quot;&gt;&lt;summary&gt;逻辑与定义&lt;/summary&gt;&lt;div class=&quot;appendix-grid&quot;&gt;&lt;div&gt;&lt;h3&gt;状态定义&lt;/h3&gt;&lt;table class=&quot;definition-table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;温和&lt;/td&gt;&lt;td&gt;增长尚可，通胀压力可控，对应 Goldilocks 型温和扩张环境。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;过热&lt;/td&gt;&lt;td&gt;增长或需求偏强，同时通胀、政策或金融条件压力上升。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;放缓&lt;/td&gt;&lt;td&gt;增长动能走弱，通胀压力不是当前主要矛盾。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;滞胀&lt;/td&gt;&lt;td&gt;增长偏弱，同时通胀或成本压力偏高。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;分歧&lt;/td&gt;&lt;td&gt;三模型没有形成多数一致结论。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;变化类型定义&lt;/h3&gt;&lt;table class=&quot;definition-table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;基准记录&lt;/td&gt;&lt;td&gt;该运行日作为目标月观察轨迹的比较起点。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;边界扰动&lt;/td&gt;&lt;td&gt;GMM 候选状态权重接近，少量数据变化就可能改变最高候选。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;历史数据修订&lt;/td&gt;&lt;td&gt;历史观测值被数据源修订，模型输入随之变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;指标新增&lt;/td&gt;&lt;td&gt;目标月此前缺失的模型输入在本次运行中补齐，coverage 上升并可能改变模型状态。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;边界扰动 + 历史数据修订&lt;/td&gt;&lt;td&gt;目标月处于分类边界附近，同时发生了输入修订。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新增数据 / 覆盖变化&lt;/td&gt;&lt;td&gt;目标月新增或补齐数据，模型输入覆盖发生变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;共识投票变化&lt;/td&gt;&lt;td&gt;三模型投票结构变化，导致多数票或共识状态变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;定义变化&lt;/td&gt;&lt;td&gt;模型窗口或配置不同，不把结果差异解释为数据变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型状态变化&lt;/td&gt;&lt;td&gt;模型输出状态变化，但当前记录没有足够输入差异明细用于进一步归因。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;logic-appendix&quot;&gt;&lt;summary&gt;目标月展示规则&lt;/summary&gt;&lt;p&gt;页面只展示最近 3 个达到可观察门槛的目标月；数据不足的月份不展示，新月份达标后自动挤掉最老月份。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;GMM 当月原始可用率 &gt;= 90%，即可展示。&lt;/li&gt;&lt;li&gt;或 Rule-Based 可观察，且 Sa/Alex Full 可观察。&lt;/li&gt;&lt;li&gt;Rule-Based 可观察：通胀 short/long 都有，且增长真实活动 short/long 或增长订单需求 short/long 至少一组完整。&lt;/li&gt;&lt;li&gt;Sa/Alex Full 可观察：增长水平、通胀水平、增长 12M 变化、通胀 12M 变化齐全；风险偏好是增强项。&lt;/li&gt;&lt;li&gt;若由轻量模型触发展示、但 GMM 未达 90%，页面标注：轻量模型先行观察，GMM 尚未完全成熟。&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;details class=&quot;logic-appendix&quot;&gt;&lt;summary&gt;状态支持度计算口径&lt;/summary&gt;&lt;p&gt;本页的四状态概率用于解释模型支持度，不改变原始模型分数、状态划分或共识标签。&lt;/p&gt;&lt;table class=&quot;definition-table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;GMM&lt;/td&gt;&lt;td&gt;&lt;code&gt;P_GMM(s) = Σ P(raw cluster=k | x) × P(s | k, same-fit history)&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rule-Based&lt;/td&gt;&lt;td&gt;规则识别状态为 1，其余状态为 0。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sa/Alex Full&lt;/td&gt;&lt;td&gt;&lt;code&gt;P_SA(s) = Σ(state_i=s) w_i / Σ w_i&lt;/code&gt;；权重来自 Similarity 邻居。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;共识支持度&lt;/td&gt;&lt;td&gt;&lt;code&gt;P_Consensus(s) = [P_GMM(s) + P_Rule(s) + P_SA(s)] / 3&lt;/code&gt;。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;共识状态仍按三模型多数投票识别；共识支持度只展示票型结构，概率最高状态不会替代既有共识标签。&lt;/p&gt;&lt;/details&gt;

e_text&quot;: &quot;14.2%&quot;, &quot;css_class&quot;: &quot;heating_up&quot;}, {&quot;state&quot;: &quot;stagflation&quot;, &quot;display&quot;: &quot;滞胀&quot;, &quot;score&quot;: 0.13207547168679246, &quot;score_text&quot;: &quot;13.2%&quot;, &quot;css_class&quot;: &quot;stagflation&quot;}], &quot;gmm_boundary&quot;: false, &quot;gmm_coverage&quot;: &quot;48/104&quot;, &quot;input_change_models&quot;: [{&quot;model_key&quot;: &quot;gmm&quot;, &quot;model_label&quot;: &quot;GMM&quot;, &quot;state_before&quot;: &quot;放缓&quot;, &quot;state_after&quot;: &quot;放缓&quot;, &quot;state_changed&quot;: false, &quot;has_previous&quot;: false, &quot;coverage_before&quot;: &quot;48/104&quot;, &quot;coverage&quot;: &quot;48/104&quot;, &quot;candidates&quot;: [{&quot;state&quot;: &quot;slow_growth&quot;, &quot;display&quot;: &quot;放缓&quot;, &quot;score&quot;: 0.43396226415660377, &quot;score_text&quot;: &quot;43.4%&quot;, &quot;css_class&quot;: &quot;slow_growth&quot;}, {&quot;state&quot;: &quot;goldilocks&quot;, &quot;display&quot;: &quot;温和&quot;, &quot;score&quot;: 0.29245283017075474, &quot;score_text&quot;: &quot;29.2%&quot;, &quot;css_class&quot;: &quot;goldilocks&quot;}, {&quot;state&quot;: &quot;heating_up&quot;, &quot;display&quot;: &quot;过热&quot;, &quot;score&quot;: 0.14150943398584903, &quot;score_text&quot;: &quot;14.2%&quot;, &quot;css_class&quot;: &quot;heating_up&quot;}, {&quot;state&quot;: &quot;stagflation&quot;, &quot;display&quot;: &quot;滞胀&quot;, &quot;score&quot;: 0.13207547168679246, &quot;score_text&quot;: &quot;13.2%&quot;, &quot;css_class&quot;: &quot;stagflation&quot;}], &quot;changes&quot;: []}, {&quot;model_key&quot;: &quot;rule_based&quot;, &quot;model_label&quot;: &quot;Rule-Based&quot;, &quot;state_before&quot;: &quot;温和&quot;, &quot;state_after&quot;: &quot;温和&quot;, &quot;state_changed&quot;: false, &quot;has_previous&quot;: false, &quot;coverage_before&quot;: &quot;7/10&quot;, &quot;coverage&quot;: &quot;7/10&quot;, &quot;candidates&quot;: [], &quot;changes&quot;: []}, {&quot;model_key&quot;: &quot;sa_alex_full&quot;, &quot;model_label&quot;: &quot;Sa/Alex Full&quot;, &quot;state_before&quot;: &quot;放缓&quot;, &quot;state_after&quot;: &quot;放缓&quot;, &quot;state_changed&quot;: false, &quot;has_previous&quot;: false, &quot;coverage_before&quot;: &quot;5/5&quot;, &quot;coverage&quot;: &quot;5/5&quot;, &quot;candidates&quot;: [{&quot;state&quot;: &quot;slow_growth&quot;, &quot;display&quot;: &quot;放缓&quot;, &quot;score&quot;: 0.7339723976, &quot;score_text&quot;: &quot;73.4%&quot;, &quot;css_class&quot;: &quot;slow_growth&quot;}, {&quot;state&quot;: &quot;goldilocks&quot;, &quot;display&quot;: &quot;温和&quot;, &quot;score&quot;: 0.2061691132, &quot;score_text&quot;: &quot;20.6%&quot;, &quot;css_class&quot;: &quot;goldilocks&quot;}, {&quot;state&quot;: &quot;heating_up&quot;, &quot;display&quot;: &quot;过热&quot;, &quot;score&quot;: 0.0598584892, &quot;score_text&quot;: &quot;6.0%&quot;, &quot;css_class&quot;: &quot;heating_up&quot;}, {&quot;state&quot;: &quot;stagflation&quot;, &quot;display&quot;: &quot;滞胀&quot;, &quot;score&quot;: 0.0, &quot;score_text&quot;: &quot;0.0%&quot;, &quot;css_class&quot;: &quot;stagflation&quot;}], &quot;changes&quot;: []}], &quot;package_dir&quot;: &quot;/home/runner/work/macro_scene_classification/macro_scene_classification/macro_quant_framework/files/output/us/20260715_assets_daily_report_29398634262&quot;}], &quot;default_event_id&quot;: &quot;2026-06__2026-07-15&quot;, &quot;eligibility_note&quot;: &quot;&quot;, &quot;stable&quot;: true}}}&lt;/script&gt;
&lt;script&gt;

const payload = JSON.parse(document.getElementById(&quot;model-update-payload&quot;).textContent);
const panels = payload.panels || {};

function escapeHtml(value) {
  return String(value ?? &quot;&quot;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (char) =&gt; ({
    &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot;, &quot;&#x27;&quot;: &quot;&amp;#39;&quot;
  })[char]);
}

function renderDetail(event) {
  const consensusBlock = renderConsensusDistribution(event);
  const inputBlock = renderModelInputTabs(event);
  return `
    &lt;div class=&quot;detail-head&quot;&gt;
      &lt;span&gt;目标月 &lt;strong&gt;${escapeHtml(event.target_month)}&lt;/strong&gt;&lt;/span&gt;
      &lt;span&gt;运行日 &lt;strong&gt;${escapeHtml(event.as_of)}&lt;/strong&gt;&lt;/span&gt;
    &lt;/div&gt;
    ${consensusBlock}
    &lt;h3&gt;模型详情&lt;/h3&gt;${inputBlock}
  `;
}

function renderConsensusDistribution(event) {
  const consensus = (event.states || {}).consensus || {};
  const rows = (consensus.distribution || []).map((row) =&gt; `
    &lt;li&gt;&lt;span class=&quot;candidate state-${escapeHtml(row.css_class)}&quot;&gt;${escapeHtml(row.display)}&lt;/span&gt;&lt;b&gt;${escapeHtml(row.score_text)}&lt;/b&gt;&lt;/li&gt;
  `).join(&quot;&quot;);
  if (!rows) return &quot;&quot;;
  return `
    &lt;div class=&quot;detail-card consensus-support&quot;&gt;
      &lt;h4&gt;共识状态支持度&lt;/h4&gt;
      &lt;p class=&quot;section-note&quot;&gt;共识标签仍由三模型多数投票决定；下列为 GMM、Rule-Based、Sa/Alex Full 的等权支持度，只解释投票结构，不改变共识状态。&lt;/p&gt;
      &lt;ul class=&quot;candidate-list&quot;&gt;${rows}&lt;/ul&gt;
    &lt;/div&gt;
  `;
}

function renderModelInputTabs(event) {
  const models = event.input_change_models || [];
  if (!models.length) {
    return `&lt;p class=&quot;empty-note&quot;&gt;本事件尚未生成输入差异明细。&lt;/p&gt;`;
  }
  const buttons = models.map((model, index) =&gt; `
    &lt;button class=&quot;model-detail-tab${index === 0 ? &quot; is-active&quot; : &quot;&quot;}&quot; data-model-tab=&quot;${escapeHtml(model.model_key)}&quot; type=&quot;button&quot;&gt;${escapeHtml(model.model_label)}&lt;/button&gt;
  `).join(&quot;&quot;);
  const panels = models.map((model, index) =&gt; {
    const changes = model.changes || [];
    const state = ((event.states || {})[model.model_key] || {});
    const candidates = renderModelCandidates(model, state);
    const changeRows = renderInputRows(changes);
    const stateTone = model.state_changed ? &quot;changed&quot; : &quot;unchanged&quot;;
    const stateText = model.state_changed
      ? `${stateWithCoverage(model.state_before, model.coverage_before)} -&gt; ${stateWithCoverage(model.state_after, model.coverage)}`
      : stateWithCoverage(model.state_after, model.coverage);
    const summary = renderModelSummary(model, changes, stateTone, stateText);
    return `
      &lt;section class=&quot;model-detail-panel${index === 0 ? &quot; is-active&quot; : &quot;&quot;}&quot; data-model-panel=&quot;${escapeHtml(model.model_key)}&quot;&gt;
        ${summary}
        ${candidates}
        &lt;div class=&quot;detail-section detail-card&quot;&gt;&lt;h4&gt;影响因素：输入变化&lt;/h4&gt;
        ${renderInputSummary(changes)}
        ${changeRows ? inputTable(changeRows) : `&lt;p class=&quot;empty-note&quot;&gt;当前截面没有可对比的输入变化。&lt;/p&gt;`}
        &lt;/div&gt;
      &lt;/section&gt;
    `;
  }).join(&quot;&quot;);
  return `&lt;div class=&quot;model-detail-tabs&quot;&gt;&lt;div class=&quot;model-detail-tablist&quot;&gt;${buttons}&lt;/div&gt;${panels}&lt;/div&gt;`;
}

function renderModelSummary(model, changes, stateTone, stateText) {
  const conclusion = !model.has_previous
    ? &quot;当前运行日的模型识别结果。&quot;
    : (model.state_changed ? &quot;本模型状态发生切换。&quot; : &quot;本模型状态未变。&quot;);
  const label = !model.has_previous
    ? &quot;当前状态&quot;
    : (model.state_changed ? &quot;结论：状态变化&quot; : &quot;结论：状态未变&quot;);
  return `
    &lt;div class=&quot;model-change-note is-${stateTone}&quot;&gt;
      &lt;div&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;b&gt;${stateText}&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;${escapeHtml(conclusion)}&lt;/p&gt;
    &lt;/div&gt;
  `;
}

function renderInputSummary(changes) {
  const added = changes.filter((row) =&gt; row.change_type === &quot;added&quot;).length;
  const revised = changes.length - added;
  return changes.length
    ? `&lt;p class=&quot;section-note&quot;&gt;本次可见新增 ${added} 个、修正 ${revised} 个。&lt;/p&gt;`
    : &quot;&quot;;
}

function renderModelCandidates(model, state) {
  let candidates = model.candidates || [];
  if (!candidates.length &amp;&amp; state.confidence &amp;&amp; [&quot;gmm&quot;, &quot;sa_alex_full&quot;].includes(model.model_key)) {
    candidates = [{
      display: state.display,
      score_text: `${(Number(state.confidence) * 100).toFixed(1)}%`,
      css_class: state.css_class,
    }];
  }
  const rows = candidates.map((row) =&gt; `
    &lt;li&gt;&lt;span class=&quot;candidate state-${escapeHtml(row.css_class)}&quot;&gt;${escapeHtml(row.display)}&lt;/span&gt;&lt;b&gt;${escapeHtml(row.score_text)}&lt;/b&gt;&lt;/li&gt;
  `).join(&quot;&quot;);
  if (!rows) return &quot;&quot;;
  if (candidates.length &lt; 4) {
    return `&lt;div class=&quot;detail-section detail-card&quot;&gt;&lt;h4&gt;已识别状态概率&lt;/h4&gt;&lt;p class=&quot;section-note&quot;&gt;该历史截面只留存了已识别状态的最高支持概率，四状态完整分布待 PIT 历史回填。&lt;/p&gt;&lt;ul class=&quot;candidate-list&quot;&gt;${rows}&lt;/ul&gt;&lt;/div&gt;`;
  }
  const note = model.model_key === &quot;gmm&quot;
    ? &quot;GMM 按现有语义候选权重展示四状态概率；最高候选与次高候选接近时，目标月处于分类边界附近。&quot;
    : &quot;Sa/Alex Full 按 Similarity 邻居相似度加权投票，展示四种宏观状态的支持概率。&quot;;
  return `&lt;div class=&quot;detail-section detail-card&quot;&gt;&lt;h4&gt;四状态分类概率&lt;/h4&gt;&lt;p class=&quot;section-note&quot;&gt;${note}&lt;/p&gt;&lt;ul class=&quot;candidate-list&quot;&gt;${rows}&lt;/ul&gt;&lt;/div&gt;`;
}

function renderInputRows(rows) {
  return rows.map((row) =&gt; `
    &lt;tr&gt;&lt;td&gt;${escapeHtml(changeTypeText(row))}&lt;/td&gt;&lt;td&gt;${escapeHtml(row.factor)}&lt;/td&gt;&lt;td&gt;${escapeHtml(row.description)}&lt;/td&gt;&lt;td&gt;${escapeHtml(row.group || &quot;&quot;)}&lt;/td&gt;&lt;td&gt;${escapeHtml(row.changed_as_of)}&lt;/td&gt;&lt;td&gt;${renderValueChange(row)}&lt;/td&gt;&lt;/tr&gt;
  `).join(&quot;&quot;);
}

function renderValueChange(row) {
  const period = row.before_period
    ? `&lt;span class=&quot;period-badge&quot;&gt;${escapeHtml(row.before_period)}&lt;/span&gt;`
    : &quot;&quot;;
  return `&lt;span class=&quot;value-change&quot;&gt;&lt;span&gt;${escapeHtml(row.before)}&lt;/span&gt;${period}&lt;span class=&quot;value-arrow&quot;&gt;→&lt;/span&gt;&lt;span&gt;${escapeHtml(row.after)}&lt;/span&gt;&lt;/span&gt;`;
}

function inputTable(rows) {
  return `&lt;table class=&quot;input-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;状态&lt;/th&gt;&lt;th&gt;指标&lt;/th&gt;&lt;th&gt;指标中文&lt;/th&gt;&lt;th&gt;类型&lt;/th&gt;&lt;th&gt;变化日&lt;/th&gt;&lt;th&gt;旧值 -&gt; 新值&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;&lt;/table&gt;`;
}

function changeTypeText(row) {
  if (row.change_type === &quot;added&quot;) return &quot;新增&quot;;
  if (row.change_type_label) return row.change_type_label.replace(&quot;指标&quot;, &quot;&quot;);
  return &quot;修正&quot;;
}

function stateWithCoverage(state, coverage) {
  return `${escapeHtml(state)}${coverage ? ` ${escapeHtml(coverage)}` : &quot;&quot;}`;
}

function selectModelTab(detail, modelKey) {
  if (!modelKey || modelKey === &quot;consensus&quot;) return;
  detail.querySelectorAll(&quot;[data-model-tab]&quot;).forEach((node) =&gt; {
    node.classList.toggle(&quot;is-active&quot;, node.dataset.modelTab === modelKey);
  });
  detail.querySelectorAll(&quot;[data-model-panel]&quot;).forEach((node) =&gt; {
    node.classList.toggle(&quot;is-active&quot;, node.dataset.modelPanel === modelKey);
  });
}

function selectEvent(panel, eventId, modelKey = &quot;&quot;) {
  const panelData = panels[panel.dataset.panel];
  const event = (panelData.events || []).find((item) =&gt; item.id === eventId) || (panelData.events || [])[0];
  if (!event) return;
  panel.querySelectorAll(&quot;[data-event-id]&quot;).forEach((node) =&gt; {
    node.classList.toggle(&quot;is-selected&quot;, node.dataset.eventId === event.id);
  });
  const detail = panel.querySelector(&quot;[data-detail-box]&quot;);
  detail.innerHTML = renderDetail(event);
  selectModelTab(detail, modelKey);
}

document.querySelectorAll(&quot;.month-tab&quot;).forEach((tab) =&gt; {
  tab.addEventListener(&quot;click&quot;, () =&gt; {
    document.querySelectorAll(&quot;.month-tab&quot;).forEach((item) =&gt; item.classList.remove(&quot;is-active&quot;));
    tab.classList.add(&quot;is-active&quot;);
    document.querySelectorAll(&quot;.month-panel&quot;).forEach((panel) =&gt; {
      const active = panel.dataset.panel === tab.dataset.month;
      panel.hidden = !active;
      if (active) selectEvent(panel, (panels[panel.dataset.panel] || {}).default_event_id);
    });
  });
});

document.querySelectorAll(&quot;.month-panel&quot;).forEach((panel) =&gt; {
  panel.addEventListener(&quot;click&quot;, (event) =&gt; {
    const modelTab = event.target.closest(&quot;[data-model-tab]&quot;);
    if (modelTab) {
      const detail = modelTab.closest(&quot;.model-detail-tabs&quot;);
      selectModelTab(detail, modelTab.dataset.modelTab);
      return;
    }
    const trigger = event.target.closest(&quot;[data-event-id]&quot;);
    if (trigger) selectEvent(panel, trigger.dataset.eventId, trigger.dataset.modelKey || &quot;&quot;);
  });
  selectEvent(panel, (panels[panel.dataset.panel] || {}).default_event_id);
});
