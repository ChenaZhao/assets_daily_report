name: Update Index

on:
  push:
    paths:
      - 'asset/macro/**.html'
      - 'asset/futures/**.html'
      - 'asset/equity/**.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate and commit asset/index.html
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 防竞态: 索引内容是目录清单的纯派生结果, 每次重试都从最新 origin/main
          # 重新生成再提交, 不做文本级合并(rebase/stash), 从根源上排除冲突标记误提交的可能
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'EOF'
          import os, re

          def list_files(subdir):
              path = f"asset/{subdir}"
              if not os.path.exists(path):
                  return []
              files = sorted(
                  [f for f in os.listdir(path) if f.endswith(".html") and f != "index.html"],
                  reverse=True
              )
              return [f"{subdir}/{f}" for f in files]

          macro   = list_files("macro")
          futures = list_files("futures")
          equity  = list_files("equity")

          def to_js_list(name, items):
              lines = ",\n".join(f'  "{f}"' for f in items)
              return f"const {name} = [\n{lines}\n];"

          index_path = "asset/index.html"
          content = open(index_path, encoding="utf-8").read()
          content = re.sub(r"const macro = \[[\s\S]*?\];",   to_js_list("macro",   macro),   content)
          content = re.sub(r"const futures = \[[\s\S]*?\];", to_js_list("futures", futures), content)
          content = re.sub(r"const equity = \[[\s\S]*?\];",  to_js_list("equity",  equity),  content)
          open(index_path, "w", encoding="utf-8").write(content)

          print(f"macro={len(macro)}, futures={len(futures)}, equity={len(equity)}")
          EOF

            git add asset/index.html
            if git diff --cached --quiet; then
              echo "no changes to index"
              exit 0
            fi
            git commit -m "auto: update asset index [skip ci]"
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, retrying (attempt $attempt)..."
            sleep $((attempt * 3))
          done
          echo "::error::failed to push asset/index.html after retries"
          exit 1
