&lt;details class=&quot;logic-appendix&quot;&gt;&lt;summary&gt;逻辑与定义&lt;/summary&gt;&lt;div class=&quot;appendix-grid&quot;&gt;&lt;div&gt;&lt;h3&gt;状态定义&lt;/h3&gt;&lt;table class=&quot;definition-table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;温和&lt;/td&gt;&lt;td&gt;增长尚可，通胀压力可控，对应 Goldilocks 型温和扩张环境。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;过热&lt;/td&gt;&lt;td&gt;增长或需求偏强，同时通胀、政策或金融条件压力上升。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;放缓&lt;/td&gt;&lt;td&gt;增长动能走弱，通胀压力不是当前主要矛盾。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;滞胀&lt;/td&gt;&lt;td&gt;增长偏弱，同时通胀或成本压力偏高。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;分歧&lt;/td&gt;&lt;td&gt;三模型没有形成多数一致结论。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;变化类型定义&lt;/h3&gt;&lt;table class=&quot;definition-table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;基准记录&lt;/td&gt;&lt;td&gt;该运行日作为目标月观察轨迹的比较起点。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;边界扰动&lt;/td&gt;&lt;td&gt;GMM 候选状态权重接近，少量数据变化就可能改变最高候选。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;历史数据修订&lt;/td&gt;&lt;td&gt;历史观测值被数据源修订，模型输入随之变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;指标新增&lt;/td&gt;&lt;td&gt;目标月此前缺失的模型输入在本次运行中补齐，coverage 上升并可能改变模型状态。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;边界扰动 + 历史数据修订&lt;/td&gt;&lt;td&gt;目标月处于分类边界附近，同时发生了输入修订。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;新增数据 / 覆盖变化&lt;/td&gt;&lt;td&gt;目标月新增或补齐数据，模型输入覆盖发生变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;证据成熟&lt;/td&gt;&lt;td&gt;三模型关键输入首次同时达到成熟门槛；这是证据里程碑，不自动改变模型状态。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;概率 / 输入变化&lt;/td&gt;&lt;td&gt;模型结论未切换，但四状态概率、覆盖度或底层输入已经发生变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;共识投票变化&lt;/td&gt;&lt;td&gt;三模型投票结构变化，导致多数票或共识状态变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;定义变化&lt;/td&gt;&lt;td&gt;模型窗口或配置不同，不把结果差异解释为数据变化。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;比较证据不足&lt;/td&gt;&lt;td&gt;历史模型定义签名缺失，只展示当前结果，不计算概率和输入差异。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;同口径重放&lt;/td&gt;&lt;td&gt;历史事件按原日期和当前模型定义重跑，用于补齐 latest 比较所需的概率、覆盖与输入截面。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;模型状态变化&lt;/td&gt;&lt;td&gt;模型输出状态变化，但当前记录没有足够输入差异明细用于进一步归因。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;logic-appendix&quot;&gt;&lt;summary&gt;目标月展示规则&lt;/summary&gt;&lt;p&gt;页面只展示最近 3 个达到可观察门槛的目标月；数据不足的月份不展示，新月份达标后自动挤掉最老月份。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;GMM 当月原始可用率 &gt;= 90%，即可展示。&lt;/li&gt;&lt;li&gt;或 Rule-Based 可观察，且 Sa/Alex Full 可观察。&lt;/li&gt;&lt;li&gt;Rule-Based 可观察：通胀 short/long 都有，且增长真实活动 short/long 或增长订单需求 short/long 至少一组完整。&lt;/li&gt;&lt;li&gt;Sa/Alex Full 可观察：增长水平、通胀水平、增长 12M 变化、通胀 12M 变化齐全；风险偏好是增强项。&lt;/li&gt;&lt;li&gt;若由轻量模型触发展示、但 GMM 未达 90%，页面标注：轻量模型先行观察，GMM 尚未完全成熟。&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;details class=&quot;logic-appendix&quot;&gt;&lt;summary&gt;证据成熟与生命周期&lt;/summary&gt;&lt;p&gt;证据成熟是目标月输入覆盖的生命周期里程碑，不代表模型状态一定发生变化。&lt;/p&gt;&lt;ul&gt;&lt;li&gt;GMM：目标月原始可用输入达到配置因子总数的 90% 或以上。&lt;/li&gt;&lt;li&gt;Rule-Based：通胀 short / long 信号齐全，且增长真实活动或订单需求至少一组 short / long 信号完整。&lt;/li&gt;&lt;li&gt;Sa/Alex Full：增长水平、通胀水平、增长 12M 变化和通胀 12M 变化四个核心向量齐全；风险偏好不作为成熟硬门槛。&lt;/li&gt;&lt;li&gt;三项必须在同一运行日、同一模型定义下同时满足；首次跨线日永久保留为“证据成熟”节点。&lt;/li&gt;&lt;li&gt;Latest 只表示当前运行截面；成熟以后覆盖继续增加，不再额外生成里程碑节点。&lt;/li&gt;&lt;li&gt;若模型定义发生变化，成熟日期不跨定义沿用，需按新定义重新积累证据。&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;details class=&quot;logic-appendix&quot;&gt;&lt;summary&gt;状态支持度计算口径&lt;/summary&gt;&lt;p&gt;本页的四状态概率用于解释模型支持度，不改变原始模型分数、状态划分或共识标签。&lt;/p&gt;&lt;table class=&quot;definition-table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;GMM&lt;/td&gt;&lt;td&gt;&lt;code&gt;P_GMM(s) = N(s, prior months in target same-fit cluster) / N(prior months in target same-fit cluster)&lt;/code&gt;；每个运行日用完整历史重新拟合，同簇成员变化会改变支持度。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rule-Based&lt;/td&gt;&lt;td&gt;规则识别状态为 1，其余状态为 0。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sa/Alex Full&lt;/td&gt;&lt;td&gt;&lt;code&gt;P_SA(s) = Σ(state_i=s) w_i / Σ w_i&lt;/code&gt;；权重来自 Similarity 邻居。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;共识支持度&lt;/td&gt;&lt;td&gt;&lt;code&gt;P_Consensus(s) = [P_GMM(s) + P_Rule(s) + P_SA(s)] / 3&lt;/code&gt;。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;共识状态仍按三模型多数投票识别；共识支持度只展示票型结构，概率最高状态不会替代既有共识标签。&lt;/p&gt;&lt;/details&gt;

&lt;script&gt;

const payload = JSON.parse(document.getElementById(&quot;model-update-payload&quot;).textContent);
const panels = payload.panels || {};

function escapeHtml(value) {
  return String(value ?? &quot;&quot;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (char) =&gt; ({
    &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot;, &quot;&#x27;&quot;: &quot;&amp;#39;&quot;
  })[char]);
}

function renderDetail(event) {
  const consensusBlock = renderConsensusDistribution(event);
  const provenanceBlock = renderComparisonProvenance(event);
  const inputBlock = renderModelInputTabs(event);
  const replayNote = event.comparison_anchor_replayed ? &quot;（同口径重放）&quot; : &quot;&quot;;
  const comparison = event.comparison_as_of
    ? `&lt;span&gt;比较基准 &lt;strong&gt;${escapeHtml(event.comparison_as_of)}${replayNote}&lt;/strong&gt;&lt;/span&gt;`
    : &quot;&quot;;
  return `
    &lt;div class=&quot;detail-head&quot;&gt;
      &lt;span&gt;目标月 &lt;strong&gt;${escapeHtml(event.target_month)}&lt;/strong&gt;&lt;/span&gt;
      &lt;span&gt;运行日 &lt;strong&gt;${escapeHtml(event.as_of)}&lt;/strong&gt;&lt;/span&gt;
      ${comparison}
    &lt;/div&gt;
    ${consensusBlock}
    ${provenanceBlock}
    &lt;h3&gt;模型详情&lt;/h3&gt;${inputBlock}
  `;
}

function renderConsensusDistribution(event) {
  const consensus = (event.states || {}).consensus || {};
  const rows = (consensus.distribution || []).map((row) =&gt; `
    &lt;li&gt;&lt;span class=&quot;candidate state-${escapeHtml(row.css_class)}&quot;&gt;${escapeHtml(row.display)}&lt;/span&gt;&lt;b&gt;${escapeHtml(row.score_text)}&lt;/b&gt;&lt;/li&gt;
  `).join(&quot;&quot;);
  if (!rows) return &quot;&quot;;
  return `
    &lt;div class=&quot;detail-card consensus-support&quot;&gt;
      &lt;h4&gt;共识状态支持度&lt;/h4&gt;
      &lt;p class=&quot;section-note&quot;&gt;共识标签仍由三模型多数投票决定；下列为 GMM、Rule-Based、Sa/Alex Full 的等权支持度，只解释投票结构，不改变共识状态。&lt;/p&gt;
      &lt;ul class=&quot;candidate-list&quot;&gt;${rows}&lt;/ul&gt;
    &lt;/div&gt;
  `;
}

function renderComparisonProvenance(event) {
  const provenance = event.comparison_provenance_changes || {};
  if (provenance.status === &quot;unavailable&quot;) {
    return `
      &lt;div class=&quot;detail-section detail-card&quot;&gt;

        &lt;p class=&quot;section-note&quot;&gt;比较基准未留存完整的代码或数据来源信息，无法判断运行环境是否变化。&lt;/p&gt;
      &lt;/div&gt;
    `;
  }
  if (provenance.status !== &quot;changed&quot;) return &quot;&quot;;
  const changes = [];
  if (provenance.code_changed) {
    const beforeDirty = provenance.git_dirty_before ? &quot;，工作区有未提交改动&quot; : &quot;&quot;;
    const afterDirty = provenance.git_dirty ? &quot;，工作区有未提交改动&quot; : &quot;&quot;;
    changes.push(`运行代码 ${shortHash(provenance.git_commit_before)}${beforeDirty} → ${shortHash(provenance.git_commit)}${afterDirty}`);
  }
  (provenance.data_source_changes || []).forEach((source) =&gt; {
    const before = source.before_exists ? shortHash(source.before_sha256) : &quot;不存在&quot;;
    const after = source.exists ? shortHash(source.sha256) : &quot;不存在&quot;;
    changes.push(`数据源 ${source.source || &quot;未命名&quot;} ${before} → ${after}`);
  });
  if (!changes.length) return &quot;&quot;;
  return `
    &lt;div class=&quot;detail-section detail-card&quot;&gt;
      &lt;h4&gt;运行来源变化&lt;/h4&gt;
      &lt;p class=&quot;section-note&quot;&gt;代码与数据来源仅用于审计追溯，不改变上方模型定义可比性的判定。&lt;/p&gt;
      &lt;p class=&quot;section-note&quot;&gt;${changes.map(escapeHtml).join(&quot;&lt;br&gt;&quot;)}&lt;/p&gt;
    &lt;/div&gt;
  `;
}

function shortHash(value) {
  const text = String(value || &quot;&quot;);
  return text ? text.slice(0, 12) : &quot;未哈希&quot;;
}

function renderModelInputTabs(event) {
  const models = event.input_change_models || [];
  if (!models.length) {
    return `&lt;p class=&quot;empty-note&quot;&gt;本事件尚未生成输入差异明细。&lt;/p&gt;`;
  }
  const buttons = models.map((model, index) =&gt; `
    &lt;button class=&quot;model-detail-tab${index === 0 ? &quot; is-active&quot; : &quot;&quot;}&quot; data-model-tab=&quot;${escapeHtml(model.model_key)}&quot; type=&quot;button&quot;&gt;${escapeHtml(model.model_label)}&lt;/button&gt;
  `).join(&quot;&quot;);
  const panels = models.map((model, index) =&gt; {
    const changes = model.changes || [];
    const state = ((event.states || {})[model.model_key] || {});
    const candidates = renderModelCandidates(model, state);
    const changeRows = renderInputRows(changes);
    const comparisonStatus = model.comparison_status || (model.has_previous ? &quot;comparable&quot; : &quot;baseline&quot;);
    const comparable = comparisonStatus === &quot;comparable&quot;;
    const probabilityChanged = comparable &amp;&amp; Boolean(model.probability_changed);
    const coverageChanged = comparable &amp;&amp; model.has_previous &amp;&amp; model.coverage_before !== model.coverage;
    const hasDetailChange = probabilityChanged || coverageChanged || changes.length &gt; 0;
    const stateTone = [&quot;definition_changed&quot;, &quot;evidence_unavailable&quot;].includes(comparisonStatus)
      ? &quot;updated&quot;
      : (model.state_changed ? &quot;changed&quot; : (hasDetailChange ? &quot;updated&quot; : &quot;unchanged&quot;));
    const stateText = model.state_changed
      ? `${stateWithCoverage(model.state_before, model.coverage_before)} -&gt; ${stateWithCoverage(model.state_after, model.coverage)}`
      : stateWithCoverage(model.state_after, model.coverage);
    const summary = renderModelSummary(
      model,
      changes,
      stateTone,
      stateText,
      probabilityChanged,
      coverageChanged,
    );
    return `
      &lt;section class=&quot;model-detail-panel${index === 0 ? &quot; is-active&quot; : &quot;&quot;}&quot; data-model-panel=&quot;${escapeHtml(model.model_key)}&quot;&gt;
        ${summary}
        ${candidates}
        &lt;div class=&quot;detail-section detail-card&quot;&gt;&lt;h4&gt;影响因素：目标月输入变化&lt;/h4&gt;
        ${renderInputSummary(model, changes, probabilityChanged)}
        ${changeRows ? `&lt;div class=&quot;input-table-scroll&quot;&gt;${inputTable(changeRows)}&lt;/div&gt;` : `&lt;p class=&quot;empty-note&quot;&gt;${inputEmptyNote(model)}&lt;/p&gt;`}
        &lt;/div&gt;
      &lt;/section&gt;
    `;
  }).join(&quot;&quot;);
  return `&lt;div class=&quot;model-detail-tabs&quot;&gt;&lt;div class=&quot;model-detail-tablist&quot;&gt;${buttons}&lt;/div&gt;${panels}&lt;/div&gt;`;
}

function renderModelSummary(model, changes, stateTone, stateText, probabilityChanged, coverageChanged) {
  const comparisonStatus = model.comparison_status || (model.has_previous ? &quot;comparable&quot; : &quot;baseline&quot;);
  const detailChanges = [];
  if (probabilityChanged) detailChanges.push(&quot;概率分布&quot;);
  if (coverageChanged) detailChanges.push(&quot;输入覆盖度&quot;);
  if (changes.length) detailChanges.push(&quot;底层输入&quot;);
  let conclusion;
  let label;
  if (comparisonStatus === &quot;definition_changed&quot;) {
    label = &quot;结论：定义变化&quot;;
    conclusion = &quot;本次与比较基准的模型定义不同，仅展示当前结果，不计算概率和输入差异。&quot;;
  } else if (comparisonStatus === &quot;evidence_unavailable&quot;) {
    label = &quot;结论：证据不足&quot;;
    conclusion = &quot;历史模型定义签名缺失，仅展示当前结果，不计算概率和输入差异。&quot;;
  } else if (!model.has_previous) {
    label = &quot;当前状态&quot;;
    conclusion = &quot;当前运行日的模型识别结果。&quot;;
  } else if (model.state_changed) {
    label = &quot;结论：状态变化&quot;;
    conclusion = &quot;本模型状态发生切换。&quot;;
  } else if (detailChanges.length) {
    label = &quot;结论：结果未变&quot;;
    conclusion = `本模型结论未变，但${detailChanges.join(&quot;、&quot;)}发生变化，明细如下。`;
  } else {
    label = &quot;结论：无变化&quot;;
    conclusion = &quot;本模型状态、概率分布与覆盖度均未变化。&quot;;
  }
  return `
    &lt;div class=&quot;model-change-note is-${stateTone}&quot;&gt;
      &lt;div&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;b&gt;${stateText}&lt;/b&gt;&lt;/div&gt;
      &lt;p&gt;${escapeHtml(conclusion)}&lt;/p&gt;
    &lt;/div&gt;
  `;
}

function inputEmptyNote(model) {
  if (!model.has_previous) return &quot;当前运行日为比较起点，暂无输入变化。&quot;;
  if (model.comparison_status === &quot;definition_changed&quot;) {
    return &quot;模型定义不同，本次不比较输入变化。&quot;;
  }
  if (model.comparison_status === &quot;evidence_unavailable&quot;) {
    return &quot;比较基准缺少模型定义签名，本次不比较输入变化。&quot;;
  }
  if (model.input_comparison_available === false) {
    if (model.model_key === &quot;gmm&quot; &amp;&amp; model.probability_changed) {
      return &quot;比较基准未保存输入截面，无法逐项回溯；概率变化仍可能来自历史重拟合。&quot;;
    }
    return &quot;比较基准未保存输入截面，无法逐项回溯。&quot;;
  }
  if (model.model_key === &quot;gmm&quot; &amp;&amp; model.probability_changed) {
    return &quot;目标月输入未见变化；概率变化可能来自历史重拟合。&quot;;
  }
  return &quot;未识别到输入新增或修正。&quot;;
}

function renderInputSummary(model, changes, probabilityChanged) {
  const counts = model.change_counts || {};
  const added = Number(counts.input_added ?? changes.filter((row) =&gt; row.change_type === &quot;added&quot;).length);
  const revised = Number(counts.input_revised ?? (changes.length - added));
  const coverageOnly = model.coverage_only_factors || [];
  if (!changes.length &amp;&amp; !coverageOnly.length) return &quot;&quot;;
  const coverageOnlyText = coverageOnly.length
    ? `另有 ${coverageOnly.length} 项只增加覆盖：${coverageOnly.map((row) =&gt; `${row.factor}${row.used_in_run ? &quot;&quot; : &quot;（未入模）&quot;}`).join(&quot;、&quot;)}。`
    : &quot;&quot;;
  const attributionNote = probabilityChanged ? &quot;下表不作逐项概率归因。&quot; : &quot;&quot;;
  return `&lt;p class=&quot;section-note&quot;&gt;输入变化：新增 ${added} 项、修正 ${revised} 项，共 ${changes.length} 项。${coverageOnlyText}${attributionNote}&lt;/p&gt;`;
}

function renderModelCandidates(model, state) {
  let candidates = model.candidates || [];
  if (!candidates.length &amp;&amp; state.confidence &amp;&amp; [&quot;gmm&quot;, &quot;sa_alex_full&quot;].includes(model.model_key)) {
    candidates = [{
      display: state.display,
      score_text: `${(Number(state.confidence) * 100).toFixed(1)}%`,
      css_class: state.css_class,
    }];
  }
  const beforeCandidates = model.has_previous ? (model.candidates_before || []) : [];
  const showComparison = Boolean(model.probability_changed) &amp;&amp; beforeCandidates.length &gt; 0;
  const beforeByState = showComparison
    ? Object.fromEntries(beforeCandidates.map((row) =&gt; [row.state, row]))
    : {};
  const rows = candidates.map((row) =&gt; {
    const before = beforeByState[row.state];
    const score = before
      ? `&lt;span class=&quot;probability-change&quot;&gt;&lt;b&gt;${escapeHtml(before.score_text)} → ${escapeHtml(row.score_text)}&lt;/b&gt;${renderProbabilityDelta(before.score, row.score)}&lt;/span&gt;`
      : `&lt;b&gt;${escapeHtml(row.score_text)}&lt;/b&gt;`;
    return `&lt;li&gt;&lt;span class=&quot;candidate state-${escapeHtml(row.css_class)}&quot;&gt;${escapeHtml(row.display)}&lt;/span&gt;${score}&lt;/li&gt;`;
  }).join(&quot;&quot;);
  if (!rows) return &quot;&quot;;
  if (candidates.length &lt; 4) {
    return `&lt;div class=&quot;detail-section detail-card&quot;&gt;&lt;h4&gt;已识别状态概率&lt;/h4&gt;&lt;p class=&quot;section-note&quot;&gt;该历史截面只留存了已识别状态的最高支持概率，四状态完整分布待 PIT 历史回填。&lt;/p&gt;&lt;ul class=&quot;candidate-list&quot;&gt;${rows}&lt;/ul&gt;&lt;/div&gt;`;
  }
  const note = model.model_key === &quot;gmm&quot;
    ? &quot;GMM 显示同簇历史月份的四状态支持度，非目标月原始后验概率。&quot;
    : &quot;Similarity 邻居加权后的四状态支持度。&quot;;
  const title = showComparison ? &quot;四状态分类概率变化&quot; : &quot;四状态分类概率&quot;;
  const comparisonNote = showComparison ? &quot;上一轨迹事件 → 当前运行日（右侧为百分点变化）。&quot; : &quot;&quot;;
  return `&lt;div class=&quot;detail-section detail-card&quot;&gt;&lt;h4&gt;${title}&lt;/h4&gt;&lt;p class=&quot;section-note&quot;&gt;${comparisonNote}${comparisonNote ? &quot; &quot; : &quot;&quot;}${note}&lt;/p&gt;&lt;ul class=&quot;candidate-list&quot;&gt;${rows}&lt;/ul&gt;&lt;/div&gt;`;
}

function renderProbabilityDelta(before, after) {
  const delta = (Number(after) - Number(before)) * 100;
  if (!Number.isFinite(delta)) return &quot;&quot;;
  const rounded = Math.abs(delta) &lt; 0.05 ? 0 : delta;
  const tone = rounded &gt; 0 ? &quot;up&quot; : (rounded &lt; 0 ? &quot;down&quot; : &quot;flat&quot;);
  const sign = rounded &gt; 0 ? &quot;+&quot; : &quot;&quot;;
  return `&lt;em class=&quot;probability-delta is-${tone}&quot;&gt;${sign}${rounded.toFixed(1)}pp&lt;/em&gt;`;
}

function renderInputRows(rows) {
  return rows.map((row) =&gt; `
    &lt;tr&gt;&lt;td&gt;${escapeHtml(changeTypeText(row))}&lt;/td&gt;&lt;td&gt;${escapeHtml(row.factor)}&lt;/td&gt;&lt;td&gt;${escapeHtml(row.description)}&lt;/td&gt;&lt;td&gt;${escapeHtml(row.group || &quot;&quot;)}&lt;/td&gt;&lt;td&gt;${escapeHtml(row.changed_as_of)}&lt;/td&gt;&lt;td&gt;${renderValueChange(row)}&lt;/td&gt;&lt;/tr&gt;
  `).join(&quot;&quot;);
}

function renderValueChange(row) {
  const period = row.before_period
    ? `&lt;span class=&quot;period-badge&quot;&gt;${escapeHtml(row.before_period)}&lt;/span&gt;`
    : &quot;&quot;;
  return `&lt;span class=&quot;value-change&quot;&gt;&lt;span&gt;${escapeHtml(row.before)}&lt;/span&gt;${period}&lt;span class=&quot;value-arrow&quot;&gt;→&lt;/span&gt;&lt;span&gt;${escapeHtml(row.after)}&lt;/span&gt;&lt;/span&gt;`;
}

function inputTable(rows) {
  return `&lt;table class=&quot;input-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;状态&lt;/th&gt;&lt;th&gt;指标&lt;/th&gt;&lt;th&gt;指标中文&lt;/th&gt;&lt;th&gt;类型&lt;/th&gt;&lt;th&gt;变化日&lt;/th&gt;&lt;th&gt;旧值 -&gt; 新值&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;&lt;/table&gt;`;
}

function changeTypeText(row) {
  if (row.change_type === &quot;added&quot;) return &quot;新增&quot;;
  if (row.change_type_label) return row.change_type_label.replace(&quot;指标&quot;, &quot;&quot;);
  return &quot;修正&quot;;
}

function stateWithCoverage(state, coverage) {
  return `${escapeHtml(state)}${coverage ? ` ${escapeHtml(coverage)}` : &quot;&quot;}`;
}

function selectModelTab(detail, modelKey) {
  if (!modelKey || modelKey === &quot;consensus&quot;) return;
  detail.querySelectorAll(&quot;[data-model-tab]&quot;).forEach((node) =&gt; {
    node.classList.toggle(&quot;is-active&quot;, node.dataset.modelTab === modelKey);
  });
  detail.querySelectorAll(&quot;[data-model-panel]&quot;).forEach((node) =&gt; {
    node.classList.toggle(&quot;is-active&quot;, node.dataset.modelPanel === modelKey);
  });
}

function selectEvent(panel, eventId, modelKey = &quot;&quot;) {
  const panelData = panels[panel.dataset.panel];
  const event = (panelData.events || []).find((item) =&gt; item.id === eventId) || (panelData.events || [])[0];
  if (!event) return;
  panel.querySelectorAll(&quot;[data-event-id]&quot;).forEach((node) =&gt; {
    node.classList.toggle(&quot;is-selected&quot;, node.dataset.eventId === event.id);
  });
  const detail = panel.querySelector(&quot;[data-detail-box]&quot;);
  detail.innerHTML = renderDetail(event);
  selectModelTab(detail, modelKey);
}

document.querySelectorAll(&quot;.month-tab&quot;).forEach((tab) =&gt; {
  tab.addEventListener(&quot;click&quot;, () =&gt; {
    document.querySelectorAll(&quot;.month-tab&quot;).forEach((item) =&gt; item.classList.remove(&quot;is-active&quot;));
    tab.classList.add(&quot;is-active&quot;);
    document.querySelectorAll(&quot;.month-panel&quot;).forEach((panel) =&gt; {
      const active = panel.dataset.panel === tab.dataset.month;
      panel.hidden = !active;
      if (active) selectEvent(panel, (panels[panel.dataset.panel] || {}).default_event_id);
    });
  });
});

document.querySelectorAll(&quot;.month-panel&quot;).forEach((panel) =&gt; {
  panel.addEventListener(&quot;click&quot;, (event) =&gt; {
    const modelTab = event.target.closest(&quot;[data-model-tab]&quot;);
    if (modelTab) {
      const detail = modelTab.closest(&quot;.model-detail-tabs&quot;);
      selectModelTab(detail, modelTab.dataset.modelTab);
      return;
    }
    const trigger = event.target.closest(&quot;[data-event-id]&quot;);
    if (trigger) selectEvent(panel, trigger.dataset.eventId, trigger.dataset.modelKey || &quot;&quot;);
  });
  selectEvent(panel, (panels[panel.dataset.panel] || {}).default_event_id);
});

&lt;/script&gt;
