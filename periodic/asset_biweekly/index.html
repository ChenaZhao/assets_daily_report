<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大类资产配置周报 · 线上版</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#152029;--ink2:#465360;--mut:#8b95a1;--line:#cfd6de;--hd:#e7ecf1;
--up:#bf262c;--dn:#0d7346;--warn:#a9670d;--accent:#25446b;--accent2:#3a6ea5;}
*{box-sizing:border-box;} html,body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:12px;line-height:1.4;}
/* 左侧目录 */
.side{position:fixed;top:0;left:0;width:210px;height:100vh;background:#1b2f47;color:#c9d4e0;overflow-y:auto;padding:14px 0;z-index:20;}
.side h2{font-size:13px;color:#fff;margin:0 0 4px;padding:0 16px;letter-spacing:.5px;}
.side .sub{font-size:10px;color:#7d90a8;padding:0 16px 10px;border-bottom:1px solid #2c4262;margin-bottom:8px;}
.side .grp{font-size:10.5px;color:#6f86a3;font-weight:700;letter-spacing:1px;padding:10px 16px 4px;}
.side a{display:block;color:#c9d4e0;text-decoration:none;font-size:12px;padding:5px 16px 5px 22px;border-left:3px solid transparent;cursor:pointer;}
.side a:hover{background:#22384f;color:#fff;}
.side a.on{background:#22384f;color:#fff;border-left-color:var(--accent2);font-weight:600;}
.side a .todo{float:right;font-size:9px;color:#6f86a3;border:1px solid #3a5170;padding:0 4px;border-radius:2px;}
/* 主区 */
.main{margin-left:210px;padding:0;}
.topbar{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--accent);padding:9px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
.topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.5px;color:var(--accent);}
.topbar .meta{font-size:11px;color:var(--ink2);}
.btns{display:flex;gap:8px;}
.btn{font-size:11px;padding:4px 12px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;border-radius:3px;}
.btn:hover{background:var(--accent);color:#fff;}
.btn.primary{background:var(--accent);color:#fff;}
.content{padding:12px 16px 50px;}
/* 导出页：4:3 容器，一块=一页PPT */
.export-page{background:var(--bg);max-width:1280px;margin:0 auto 18px;padding:9px 12px 7px;border:1px solid var(--line);}
.page-title{font-size:15px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:6px;margin:0 0 12px;}
.page-title .sub{font-size:11px;font-weight:400;color:var(--ink2);margin-left:8px;}
/* 组件 */
.sec{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--accent);border-left:3px solid var(--accent);padding-left:7px;margin:14px 0 7px;}
.card{background:var(--card);border:1px solid var(--line);padding:6px 9px;margin-bottom:7px;}
.ct{font-size:10.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--line);}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px;}
.kpi{background:var(--card);padding:5px 9px;}
.kpi-lab{color:var(--ink2);font-size:10.5px;margin-bottom:3px;}
.kpi-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.kpi-val.up{color:var(--up);} .kpi-val.dn{color:var(--dn);}
.kpi-unit{font-size:10px;color:var(--mut);font-weight:500;margin-left:2px;}
.kpi-sub{color:var(--mut);font-size:10px;margin-top:2px;}
table.grid{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
table.grid th{background:var(--hd);color:var(--ink2);font-weight:600;font-size:10.5px;padding:4px 7px;text-align:right;border:1px solid var(--line);white-space:nowrap;}
table.grid th:first-child,table.grid th:nth-child(2){text-align:left;}
table.grid td{padding:3px 7px;text-align:right;border:1px solid #e5eaef;white-space:nowrap;font-size:11px;line-height:1.55;}
table.grid td.sym{text-align:left;font-weight:600;}
table.grid td.cat{text-align:left;font-weight:700;color:var(--accent);background:#f2f5f8;}
table.grid tbody tr:hover{background:#eef3f8;}
table.grid td.hl{font-weight:700;}
.up{color:var(--up);} .dn{color:var(--dn);} .flat{color:var(--ink2);} .muted{color:var(--mut);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start;}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;margin-bottom:7px;}
.pg .full,.pg .hd,.pg .kpis{grid-column:1/-1;}
.pg.g12{grid-template-columns:repeat(12,1fr);}
.pg.g12 .w5{grid-column:span 5;} .pg.g12 .w7{grid-column:span 7;} .pg.g12 .w6{grid-column:span 6;}

.page-title.big{font-size:19px;letter-spacing:.5px;}
.cbox{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);padding:9px 12px;margin-bottom:8px;}
.cbox.hi{background:#f4f7fb;border-left-color:#b03a3f;}
.cbox .t{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:5px;letter-spacing:.5px;}
ul.lv1{margin:3px 0 3px 2px;padding-left:15px;}
ul.lv1>li{margin:3px 0;line-height:1.7;font-size:11px;}
ul.lv1>li::marker{color:var(--accent);}
ul.lv2{margin:2px 0 4px 0;padding-left:15px;list-style:none;}
ul.lv2>li{margin:2px 0;line-height:1.65;font-size:11px;color:var(--ink2);position:relative;padding-left:9px;}
ul.lv2>li:before{content:"·";position:absolute;left:0;color:#8b95a1;font-weight:700;}
.dl{color:#25446b;font-weight:700;}
.lbl{display:inline-block;min-width:34px;font-weight:700;color:var(--accent);}

table.vt{width:100%;border-collapse:collapse;font-size:11px;line-height:1.6;}
table.vt th{background:#e7ecf1;color:#465360;font-weight:600;font-size:10.5px;padding:5px 7px;text-align:left;border:1px solid var(--line);white-space:nowrap;}
table.vt td{padding:5px 7px;border:1px solid #e5eaef;vertical-align:top;font-size:11px;white-space:normal;}
table.vt tr:hover{background:#eef3f8;}
table.vt td.as{font-weight:700;white-space:nowrap;font-size:11px;}
table.vt td.pf{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11px;}
.inst{color:#25446b;font-weight:700;}
.srcchip{display:inline-block;background:#eef4fb;border:1px solid #cfdcea;color:#25446b;border-radius:3px;
 padding:1px 6px;margin:1px 3px 1px 0;font-size:10px;text-decoration:none;white-space:nowrap;}
.srcchip:hover{background:#25446b;color:#fff;}
.wkbadge{display:inline-block;background:#25446b;color:#fff;font-size:10px;padding:1px 7px;border-radius:3px;margin-left:6px;}
.wkbadge.prev{background:#8b95a1;}

#tip{position:fixed;z-index:999;background:rgba(21,32,43,.96);color:#fff;font-size:11px;line-height:1.5;
 padding:5px 9px;border-radius:3px;pointer-events:none;display:none;white-space:pre;max-width:320px;
 box-shadow:0 2px 8px rgba(0,0,0,.25);}
svg [data-tip]{cursor:crosshair;}
.hd{grid-column:1/-1;} .hd .judge{font-size:11px;color:var(--ink2);line-height:1.6;margin-top:2px;}
.foot{color:var(--mut);font-size:10px;line-height:1.7;margin-top:10px;border-top:1px solid var(--line);padding-top:7px;}
.foot b{color:var(--ink2);}
.placeholder{background:var(--card);border:1px dashed var(--line);padding:40px;text-align:center;color:var(--mut);font-size:12px;}
svg text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
@media print{ .side,.topbar{display:none;} .main{margin-left:0;} .export-page{page-break-after:always;border:none;} }

/* ---- 移动端适配（上传时注入） ---- */
@media(max-width:860px){
  .side{position:static;width:100%;height:auto;padding:8px 0;}
  .side a{display:inline-block;width:auto;padding:5px 10px;border-left:0;border-bottom:2px solid transparent;}
  .side a.on{border-left:0;border-bottom-color:#3a6ea5;}
  .side .grp{padding:8px 12px 2px;}
  .main{margin-left:0;}
  .topbar{position:static;flex-wrap:wrap;gap:6px;padding:8px 12px;}
  .content{padding:10px 10px 40px;}
  .export-page{max-width:100%;padding:8px 9px;}
  .pg,.pg.g12,.grid2,.grid3{grid-template-columns:1fr !important;}
  .pg.g12 .w5,.pg.g12 .w6,.pg.g12 .w7{grid-column:1/-1 !important;}
  .kpi-row{grid-template-columns:repeat(2,1fr) !important;}
  .page-title,.page-title.big{font-size:15px !important;}
  table.grid,table.vt,table{font-size:10.5px !important;}
  td,th{white-space:normal !important;}
  .wrap{padding:10px 10px 30px;}
  svg{max-width:100%;height:auto;}
  div[style*="overflow:auto"],.tscroll{-webkit-overflow-scrolling:touch;}
}
@media(max-width:520px){
  .kpi-row{grid-template-columns:1fr !important;}
  table.grid,table.vt,table{font-size:10px !important;}
}
</style></head>

// ---- 分类色(固定顺序，dataviz 口径) ----
const CLR=['#3a6ea5','#c77b16','#0e8a8a','#7a5195','#2f8f4e','#bc5090','#8a6d3b','#4b6584','#9e1f22'];

const CATC={'股指':'#2f6fb5','权益':'#2f6fb5','固收':'#b03a3f','债券':'#b03a3f','外汇':'#7a5195','商品':'#c77b16','其他':'#8b95a1'};

// ---- 分组竖柱(每个分类若干根，用于 涨/跌/净 三者并列) ----
function barGroup(cats,defs,opt){
  opt=opt||{};const w=opt.w||560,h=opt.h||210,pad={l:34,r:10,t:16,b:34};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,n=cats.length,m=defs.length;

  let mx=Math.max(...all,0),mn=Math.min(...all,0);const p=(mx-mn)*0.12||1;mx+=p;mn-=(mn<0?p:0);

  s+=`<line x1="${pad.l}" y1="${Y(0)}" x2="${w-pad.r}" y2="${Y(0)}" stroke="#c2ccd6"/>`;
  cats.forEach((c,i)=>{
    const x0=pad.l+gap*i+(gap-bw*m)/2;
    defs.forEach((d,j)=>{const v=d.get(c);if(v==null)return;
      const x=x0+j*bw,y=Y(v),yb=Y(0),col=(typeof d.col==='function'?d.col(c,v):d.col);
      s+=`<rect x="${x+1}" y="${Math.min(y,yb)}" width="${bw-2}" height="${Math.max(Math.abs(y-yb),1)}" fill="${col}" opacity="0.9" data-tip="${c} ${d.name} ${v}"></rect>`;
      s+=`<text x="${x+bw/2}" y="${v>=0?y-2.5:y+9}" text-anchor="middle" font-size="8" fill="${col}" font-weight="600">${v}</text>`;});
    s+=`<text x="${pad.l+gap*i+gap/2}" y="${h-pad.b+14}" text-anchor="middle" font-size="9" font-weight="700" fill="${catColOf(c)}">${c}</text>`;});

     defs.map(d=>`<span style="margin-right:12px"><span style="display:inline-block;width:9px;height:9px;background:${typeof d.col==='function'?d.col(cats[0],1):d.col};margin-right:3px;vertical-align:middle"></span>${d.name}</span>`).join('')+`</div>`;

// ---- 内联SVG 多折线(自适应Y、网格、末端标注/图例) ----

// ---- 内联SVG 散点(x=波动 y=涨跌 色=簇) ----

// ---- 内联SVG 相关性热力(diverging：正=蓝 负=橙 0=浅) ----
function heatmap(labels,mat,opt){

// ---- 双轴折线(左轴深蓝/右轴橙) ----

  for(let k=0;k<=ticks;k++){const i=Math.round((n-1)*k/ticks);if(i>=0&&i<n)s+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle" font-size="8.5" fill="#8b95a1">${(dates[i]||'').slice(2)}</text>`;}
  for(let i=0;i<n;i++){const lv=(left.vals||[])[i],rv=(right.vals||[])[i];if(lv==null&&rv==null)continue;
    s+=`<rect x="${(X(i)-iw/(2*Math.max(n-1,1))).toFixed(1)}" y="${pad.t}" width="${Math.max(iw/Math.max(n-1,1),2).toFixed(1)}" height="${ih}" fill="transparent" data-tip="${dates[i]||''}　${left.name} ${lv==null?'—':lv}　${right.name} ${rv==null?'—':rv}"></rect>`;}
  return s+`</svg>`;
}
// ---- 堆叠面积(左轴)+解释度线(右轴) ----
function areaLine(dates,area,r2,opt){
  opt=opt||{};const w=opt.w||450,h=opt.h||225,pad={l:32,r:36,t:12,b:20};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,n=dates.length;
  let mx=0,mn=0;for(let i=0;i<n;i++){let ps=0,ns=0;area.forEach(se=>{const v=se.vals[i]||0;v>=0?ps+=v:ns+=v;});mx=Math.max(mx,ps);mn=Math.min(mn,ns);}if(mx===mn)mx=1;
  const X=i=>pad.l+iw*(n<=1?0:i/(n-1)),Y=v=>pad.t+ih*(1-(v-mn)/(mx-mn));
  const ra=r2.filter(v=>v!=null);let r2mn=ra.length?Math.min(...ra):0,r2mx=ra.length?Math.max(...ra):1;if(r2mn===r2mx){r2mn-=1;r2mx+=1;}
  const YR=v=>pad.t+ih*(1-(v-r2mn)/(r2mx-r2mn));
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-height:${h}px">`;
  s+=`<line x1="${pad.l}" y1="${Y(0)}" x2="${w-pad.r}" y2="${Y(0)}" stroke="#c2ccd6"/>`;
  const pb=new Array(n).fill(0),nb=new Array(n).fill(0);
  area.forEach((se,si)=>{const c=CLR[si%CLR.length];let top=[],bot=[];
    for(let i=0;i<n;i++){const v=se.vals[i]||0;let b,t;if(v>=0){b=pb[i];t=pb[i]+v;pb[i]=t;}else{t=nb[i];b=nb[i]+v;nb[i]=b;}top.push([i,t]);bot.push([i,b]);}
    let d='M'+top.map(([i,y])=>X(i).toFixed(1)+' '+Y(y).toFixed(1)).join(' L')+' L'+bot.reverse().map(([i,y])=>X(i).toFixed(1)+' '+Y(y).toFixed(1)).join(' L')+' Z';
    s+=`<path d="${d}" fill="${c}" fill-opacity="0.5" data-tip="${se.name}"></path>`;});
  let d='',st=false;r2.forEach((v,i)=>{if(v==null)return;d+=(st?'L':'M')+X(i).toFixed(1)+' '+YR(v).toFixed(1)+' ';st=true;});
  s+=`<path d="${d}" fill="none" stroke="#152029" stroke-width="1.6"/>`;
  s+=`<text x="${w-pad.r}" y="9" text-anchor="end" font-size="8" fill="#152029">R²·右</text>`;
  area.forEach((se,si)=>{s+=`<text x="${pad.l+si*48}" y="9" font-size="8" fill="${CLR[si%CLR.length]}">${se.name}</text>`;});
  [0,Math.floor(n/2),n-1].forEach(i=>{if(i>=0&&i<n)s+=`<text x="${X(i)}" y="${h-5}" text-anchor="middle" font-size="8" fill="#8b95a1">${(dates[i]||'').slice(2)}</text>`;});
  return s+`</svg>`;
}

function scoreTable(rows){
  const sorted=[...rows].filter(r=>r.mom!==null).sort((a,b)=>b.mom-a.mom);
  const sc=sorted.map(r=>r.score).filter(v=>v!=null);
  const smx=sc.length?Math.max(...sc):1,smn=sc.length?Math.min(...sc):0;
  const md=sorted.map(r=>r.mid).filter(v=>v!=null);
  const mmx=md.length?Math.max(...md):100,mmn=md.length?Math.min(...md):0;
  let h=`<div style="overflow:auto;max-height:520px"><table class="grid"><thead><tr><th>#</th><th>资产</th><th>类别</th><th>周涨跌</th><th>短期动量</th><th>中期动量</th><th>总分</th><th>簇</th></tr></thead><tbody>`;
  sorted.forEach((r,i)=>{
    const a=r.mom==null?0:Math.min(Math.max(r.mom,0),1);
    const bg=`background:rgba(37,68,107,${(a*0.5).toFixed(2)});color:${a>0.55?'#fff':'#152029'}`;
    const sa=(r.score==null||smx===smn)?0:(r.score-smn)/(smx-smn);
    const sbg=r.score==null?'':`background:rgba(199,123,22,${(sa*0.62).toFixed(2)})`;
    const ma=(r.mid==null||mmx===mmn)?0:(r.mid-mmn)/(mmx-mmn);
    const mbg=r.mid==null?'':`background:rgba(14,138,138,${(ma*0.45).toFixed(2)})`;
    h+=`<tr><td class="muted">${i+1}</td><td class="sym" style="color:${clsColOf(r.cls)}">${r.name}</td><td class="muted" style="color:${clsColOf(r.cls)}">${r.cls}</td><td class="${cls(r.chg)}">${r.chg==null?'—':fmtPct(r.chg)}</td><td style="${bg}">${r.mom==null?'—':r.mom.toFixed(3)}</td><td style="${mbg}">${r.mid==null?'—':(r.mid).toFixed(1)}</td><td class="hl" style="${sbg}">${r.score==null?'—':r.score.toFixed(2)}</td><td class="muted">${r.km==null?'':r.km}</td></tr>`;});
  return h+`</tbody></table></div>`;
}

function renderAttr(){
  const A=D.attribution,FC=['增长','通胀','利率','境外'];
  const fcol={'增长':'#3a6ea5','通胀':'#c77b16','利率':'#b03a3f','境外':'#7a5195'};
  const one=(g,t)=>`<div class="card"><div class="ct">${t}　风险贡献占比堆叠 + 宏观解释度R²(右轴黑线) <b>${g.latest.R2}%</b>　增长${g.latest['增长']} 通胀${g.latest['通胀']} 利率${g.latest['利率']} 境外${g.latest['境外']}</div>${areaLine(g.dates,g.rc,g.r2,{w:600,h:250})}</div>`;
  const rone=(g,t)=>{const rr=(g.retc13&&g.retc13.length?g.retc13:g.retc);
    const lat=rr.map(s=>{const v=[...s.vals].reverse().find(x=>x!=null);return s.name+' '+(v==null?'—':(v>0?'+':'')+v.toFixed(2));}).join('　');
    return `<div class="card"><div class="ct">${t}　收益贡献堆叠（13周滚动累计 %，正负分列）+ 解释方差占比(右轴黑线)　${lat}</div>${areaLine(g.dates,rr,g.vsf||g.r2,{w:600,h:230})}</div>`;};
  const bone=(g,t)=>{const bs=(g.beta_s||[]).map(s=>{const v=s.vals.filter(x=>x!=null);
      const m=v.length?v.reduce((a,b)=>a+b,0)/v.length:0;
      const sd=v.length>1?Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(v.length-1)):1;
      const lv=[...s.vals].reverse().find(x=>x!=null);
      return {name:s.name+(lv==null?'':' '+lv.toFixed(2)),vals:s.vals.map(x=>x==null?null:+((x-m)/(sd||1)).toFixed(3))};});
    const raw=(g.beta_s||[]).map(s=>{const lv=[...s.vals].reverse().find(x=>x!=null);return s.name+' '+(lv==null?'—':lv.toFixed(2));}).join('　');
    return `<div class="card"><div class="ct">${t}　四因子 beta 走势（各自 z-score 后同图可比，图例数字＝最新原始 beta）　原始值 ${raw}</div>${lineChart(g.dates,bs,{w:600,h:230,dec:1,r:78,cols:(g.beta_s||[]).map(s=>fcol[s.name]||'#8b95a1')})}</div>`;};
  const wtab=(g,t)=>{
    let s=`<div class="card"><div class="ct">${t}　最近 4 期收益贡献分解（%，实际＝预测+残差；alpha 为截距项）</div><table class="grid"><thead><tr><th>日期</th>`+
      FC.map(f=>`<th style="color:${fcol[f]}">${f}</th>`).join('')+`<th>alpha</th><th>模型预测</th><th>残差</th><th>实际收益</th></tr></thead><tbody>`;
    (g.wk||[]).slice().reverse().forEach(r=>{s+=`<tr><td class="sym">${r.date}</td>`+
      FC.map(f=>`<td class="${cls(r[f])}">${r[f]==null?'—':fmtPct(r[f])}</td>`).join('')+
      `<td class="${cls(r.alpha)}">${r.alpha==null?'—':fmtPct(r.alpha)}</td><td class="${cls(r.pred)}">${r.pred==null?'—':fmtPct(r.pred)}</td><td class="${cls(r.resid)}">${r.resid==null?'—':fmtPct(r.resid)}</td><td class="${cls(r.ret)} hl">${r.ret==null?'—':fmtPct(r.ret)}</td></tr>`;});
    return s+`</tbody></table></div>`;};
  const lr=A.allw.wk&&A.allw.wk.length?A.allw.wk[A.allw.wk.length-1]:{};
  const drv=FC.filter(f=>lr[f]!=null).sort((a,b)=>Math.abs(lr[b])-Math.abs(lr[a]))[0];
  let h=`<div class="export-page"><div class="hd"><div class="page-title">组合归因 <span class="sub">风险贡献 · 收益贡献 · 因子beta · 近4期分解 · ${D.meta.asof}</span></div>`;
  h+=`<div class="judge">ALLW 宏观解释度 ${A.allw.latest.R2}%、FRP ${A.frp.latest.R2}%，解释度越高说明收益越由宏观因子决定、特质收益越少。本周 ALLW 收益的主导因子是 ${drv||'—'}（贡献 ${drv&&lr[drv]!=null?fmtPct(lr[drv]):'—'}），残差 ${lr.resid==null?'—':fmtPct(lr.resid)} 表示模型之外的部分。风险贡献看的是方差分配、收益贡献看的是当期损益，两者背离时说明暴露在赚钱但不是主要风险来源。</div></div>`;
  h+=`<div class="pg">${one(A.allw,'全天候 ALLW')}${one(A.frp,'风险平价 FRP')}</div>`;
  h+=`<div class="pg">${rone(A.allw,'ALLW')}${rone(A.frp,'FRP')}</div>`;
  h+=`<div class="pg">${bone(A.allw,'ALLW')}${bone(A.frp,'FRP')}</div>`;
  h+=`<div class="pg">${wtab(A.allw,'ALLW')}${wtab(A.frp,'FRP')}</div>`;
  h+=footNote('组合归因','ALLW · FRP（34/35 列全量字段）','风险贡献＝var_rc_share；收益贡献＝ret_contrib；beta＝滚动回归暴露；R²＝rolling_R2');
  return h+`</div>`;
}

function renderQis(){

  const rows=[...(Q.rows||[])];
  const withchg=rows.filter(r=>r.chg!==null&&r.chg!==undefined).sort((a,b)=>b.chg-a.chg);
  const up=withchg.filter(r=>r.chg>0).length,dn=withchg.filter(r=>r.chg<0).length;
  const compcol={};BC.forEach((c,i)=>compcol[c.name]=CLR[i%CLR.length]);
  let h=`<div class="export-page"><div class="hd"><div class="page-title">QIS 策略跟踪 <span class="sub">公司 · 策略分类 · 名称 · 解释 · 最新净值 · 周环比 · 数据 ${Q.asof}</span></div>`;
  h+=`<div class="judge">纳入 ${rows.length} 条 QIS 指数、${BS.length} 个策略分类、${BC.length} 家公司，本周涨 ${up} 跌 ${dn}。表现最强分类 ${BS.length?BS[0].name+' 均值'+fmtPct(BS[0].mean):'—'}、最弱 ${BS.length?BS[BS.length-1].name+' 均值'+fmtPct(BS[BS.length-1].mean):'—'}。QIS 是把机构定价的风险溢价拆成可交易腿，分类之间同向还是背离，比单条指数的涨跌更能反推市场在为哪种风险付费。</div></div>`;
  h+=`<div class="kpi-row"><div class="kpi"><div class="kpi-lab">纳入指数</div><div class="kpi-val">${rows.length}</div></div><div class="kpi"><div class="kpi-lab">策略分类</div><div class="kpi-val">${BS.length}</div></div><div class="kpi"><div class="kpi-lab">本周上涨</div><div class="kpi-val up">${up}</div></div><div class="kpi"><div class="kpi-lab">本周下跌</div><div class="kpi-val dn">${dn}</div></div><div class="kpi"><div class="kpi-lab">最强</div><div class="kpi-val up" style="font-size:13px">${withchg.length?fmtPct(withchg[0].chg):'—'}</div><div class="kpi-sub">${withchg.length?withchg[0].name:''}</div></div><div class="kpi"><div class="kpi-lab">最弱</div><div class="kpi-val dn" style="font-size:13px">${withchg.length?fmtPct(withchg[withchg.length-1].chg):'—'}</div><div class="kpi-sub">${withchg.length?withchg[withchg.length-1].name:''}</div></div></div>`;
  h+=`<div class="pg">`;
  h+=`<div class="card"><div class="ct">按策略分类的平均周环比（名后数字为分类内指数条数，涨红跌绿）</div>${barH(BS.filter(s=>s.mean!=null).map(s=>({name:s.name+' ×'+s.n,v:s.mean})),{w:680,rh:16,pad:{l:210,r:56,t:6,b:6}})}</div>`;
  h+=`<div class="card"><div class="ct">按公司的平均周环比与内部分化（均值点、最好/最差区间）</div>${dispChart(BC.map(c=>({cat:c.name,min:c.worst,max:c.best,mean:c.mean,meancur:c.mean,n:c.n})),compcol)}
    <table class="grid" style="margin-top:6px"><thead><tr><th>公司</th><th>条数</th><th>均值</th><th>最好</th><th>最差</th><th>涨</th><th>跌</th></tr></thead><tbody>`+
    BC.map(c=>`<tr><td class="sym" style="color:${compcol[c.name]}">${c.name}</td><td class="muted">${c.n}</td><td class="${cls(c.mean)} hl">${c.mean==null?'—':fmtPct(c.mean)}</td><td class="up">${c.best==null?'—':fmtPct(c.best)}</td><td class="dn">${c.worst==null?'—':fmtPct(c.worst)}</td><td class="up">${c.up}</td><td class="dn">${c.dn}</td></tr>`).join('')+
    `</tbody></table></div></div>`;
  // 分类解释表
  h+=`<div class="card"><div class="ct">策略分类解释与本周表现（按均值排序；解释取自 QIS产品跟踪『表格』的「解释」列）</div><div style="overflow:auto;max-height:300px"><table class="grid"><thead><tr><th style="text-align:left">策略分类</th><th>条数</th><th>均值</th><th>最好</th><th>最差</th><th style="text-align:left">原理解释</th></tr></thead><tbody>`+

    `</tbody></table></div></div>`;
  // 全量明细（按 xlsx『表格』结构）
  h+=`<div class="card"><div class="ct">全量明细（照 QIS产品跟踪『表格』结构：公司 / 策略分类 / 名称 / 解释 / Bloomberg / 最新净值 / 周环比，另附近 4 周涨跌）</div><div style="overflow:auto;max-height:620px"><table class="grid"><thead><tr><th>公司</th><th style="text-align:left">策略分类</th><th style="text-align:left">名称</th><th style="text-align:left">解释</th><th>Bloomberg</th><th>最新净值</th><th>周环比</th>`+
    WKS.map(d=>`<th>${d.slice(5)}</th>`).join('')+`</tr></thead><tbody>`;
  let pc='',ps='';
  rows.forEach(r=>{
    const a=Math.min(Math.abs(r.chg||0)/2,1);const bg=`background:rgba(${r.chg>=0?'191,38,44':'13,115,70'},${(a*0.5).toFixed(2)})`;
    const nc=(r.comp!==pc),ns=(r.strat!==ps);pc=r.comp;ps=r.strat;
    h+=`<tr><td class="sym" style="color:${compcol[r.comp]||'#465360'}">${nc?r.comp:''}</td>`+
      `<td style="text-align:left;white-space:normal;min-width:120px;font-weight:${ns?700:400};color:${ns?'#25446b':'#8b95a1'}">${ns?r.strat:''}</td>`+
      `<td class="sym" style="text-align:left;white-space:normal;min-width:120px">${r.name||''}</td>`+
      `<td class="muted" style="text-align:left;white-space:normal;min-width:260px">${ns?(r.desc||''):''}</td>`+
      `<td class="muted">${r.bbg}</td><td>${r.nav==null?'—':r.nav}</td>`+
      `<td class="${cls(r.chg)}" style="${bg}">${r.chg==null?'—':(r.chg>0?'+':'')+r.chg+'%'}</td>`+
      (r.rets||[]).slice(1).map(v=>`<td class="${cls(v)}">${v==null?'—':(v>0?'+':'')+v+'%'}</td>`).join('')+
      `</tr>`;});
  h+=`</tbody></table></div></div>`;
  h+=footNote('QIS策略','QIS产品跟踪『表格』+『周度变化』','按公司→策略分类→名称层级展开；周环比取自表格列，近 4 周由周度变化净值序列换算');
  return h+`</div>`;
}

const PAGES={
  p_conclusion:{render:renderConclusion}, p_view:{render:renderView}, p_report:{render:renderReport},

  p_rp:{render:renderPortfolio}, p_attr:{render:renderAttr}, p_macro:{render:renderMacro}, p_qis:{render:renderQis}, p_howto:{render:renderHowto},
};
function showPage(id){
  document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on', a.dataset.page===id));
  const p=PAGES[id];
  $('content').innerHTML = p ? p.render() : `<div class="placeholder">「${document.querySelector('.side a[data-page="'+id+'"]').textContent.replace('待建','').trim()}」页 · 待建（阶段2接入）</div>`;
  window.scrollTo(0,0);
}
// ---- 一键导出 PPT（逐页渲染→html-to-image 截图→PptxGenJS 每页一图，4:3） ----
async function exportPPT(ev){
  if(typeof PptxGenJS==='undefined'||typeof htmlToImage==='undefined'){alert('导出库未加载：请确认同目录 lib/ 下有 html-to-image.js 与 pptxgen.bundle.js');return;}
  const btn=ev&&ev.target; if(btn){btn.textContent='导出中…';btn.disabled=true;}
  const pptx=new PptxGenJS(); pptx.defineLayout({name:'W43',width:10,height:7.5}); pptx.layout='W43';
  const host=$('content'); const cur=document.querySelector('.side a.on'); const curId=cur?cur.dataset.page:'p_weekly';
  for(const id of Object.keys(PAGES)){
    host.innerHTML=PAGES[id].render();
    const el=host.querySelector('.export-page'); if(!el) continue;
    await new Promise(r=>setTimeout(r,60));
    try{
      const url=await htmlToImage.toPng(el,{pixelRatio:2,backgroundColor:'#eef1f4',width:el.scrollWidth,height:el.scrollHeight});
      const iw=el.scrollWidth,ih=el.scrollHeight,pw=10,ph=7.5,sc=Math.min(pw/iw,ph/ih),w=iw*sc,h=ih*sc;
      const slide=pptx.addSlide(); slide.background={color:'EEF1F4'};
      slide.addImage({data:url,x:(pw-w)/2,y:(ph-h)/2,w:w,h:h});
    }catch(e){ console.error('导出页失败',id,e); }
  }
  await pptx.writeFile({fileName:'大类资产配置周报_'+(D.meta.asof||'')+'.pptx'});
  showPage(curId); if(btn){btn.textContent='一键导出 PPT';btn.disabled=false;}
}
// ---- 即时 tooltip（跟随鼠标） ----
(function(){
  const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
  document.addEventListener('mousemove',function(e){
    const el=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
    if(el){ tip.textContent=el.getAttribute('data-tip'); tip.style.display='block';
      let x=e.clientX+14,y=e.clientY+14;
      const r=tip.getBoundingClientRect();
      if(x+r.width>window.innerWidth-8)x=e.clientX-r.width-14;
      if(y+r.height>window.innerHeight-8)y=e.clientY-r.height-14;
      tip.style.left=x+'px'; tip.style.top=y+'px';
    } else { tip.style.display='none'; }
  },{passive:true});
  document.addEventListener('mouseleave',()=>{tip.style.display='none';});
})();
function init(){
  if(!D){ $('content').innerHTML='<div class="placeholder">未找到 data.js，请先运行 build_online.py</div>'; return; }

  document.querySelectorAll('.side a').forEach(a=>a.onclick=()=>showPage(a.dataset.page));
  showPage((location.hash||'').replace('#','')||'p_weekly');
  window.onhashchange=()=>showPage((location.hash||'').replace('#','')||'p_weekly');
}
