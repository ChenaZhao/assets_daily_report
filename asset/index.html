<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产层日报</title>
<style>
:root{--ink:#0b1f3a;--soft:#40536f;--muted:#6c7f98;--line:#c9d5e4;--surface:#f4f7fb;--blue:#1d4ed8;--deep:#17366f;--gold:#b8860b;--up:#c8102e;--down:#00873c}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
.page{max-width:980px;margin:auto;padding:22px 34px 60px}
.masthead{border-top:4px solid var(--deep);border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding:13px 0}
.brand{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;font-size:28px;font-weight:900;color:var(--deep);text-decoration:none;line-height:1.2}
.brand i{font-style:normal;color:var(--gold)}
.mh-meta{text-align:right;color:var(--muted);font-size:11px;letter-spacing:.06em}
.mh-meta b{color:var(--ink)}
.crumb{margin:10px 0 0;font-size:12px;color:var(--muted)}
.crumb a{color:var(--soft);text-decoration:none}.crumb a:hover{color:var(--blue)}.crumb b{color:var(--ink);font-weight:600}
.intro{margin:22px 0 4px}
.eyebrow{display:block;color:var(--accent,var(--blue));font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.intro h1{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;font-size:26px;font-weight:900;color:var(--deep);margin:0;line-height:1.3}
.intro p{color:var(--soft);margin:6px 0 0;font-size:13px}
.asof-strip{margin:12px 0 0;border-left:3px solid var(--gold);background:var(--surface);padding:8px 12px;color:var(--soft);font-size:12px}
.section-title{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--deep);margin:26px 0 0;padding-bottom:5px}
.section-title>span{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;color:var(--gold);font-size:18px;font-weight:900}
.section-title h2{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;margin:0;font-size:18px;color:var(--deep)}
.section-title small{margin-left:auto;color:var(--muted);font-size:11px}

/* 卡片栅格与统一卡片：首页 entry、策略层 mod、定期报告与中国宏观 card、数据库 entry-card */
.stack,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.l-asset{--accent:#17366f;--tint:#eef3fa}.l-strategy{--accent:#00873c;--tint:#edf6f0}.l-data{--accent:#b8860b;--tint:#faf5e8}.l-periodic{--accent:#1d4ed8;--tint:#eef2fd}.l-none{--accent:#6c7f98;--tint:#f4f7fb}.l-eqcta{--accent:#6d28d9;--tint:#f3effc}.l-macro{--accent:#0f766e;--tint:#ebf6f4}
.entry,.mod,.card,.entry-card{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-left:3px solid var(--accent,var(--deep));background:var(--tint,var(--surface));padding:15px 17px 13px;text-decoration:none;color:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
a.entry:hover,a.mod:hover,a.card:hover,a.entry-card:hover{border-color:var(--accent,var(--deep));box-shadow:0 3px 12px rgba(11,31,58,.10)}
.page>.card{margin-top:10px}
.mod-icon,.card>.icon{display:none}
.mod-body,.card>.body,.entry-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.entry .tag,.mod-tag,.card .tag,.entry-label{color:var(--accent,var(--blue));font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.entry .title,.mod-title,.card .title,.card h2,.card h3,.entry-body h2{font-size:16px;font-weight:800;color:var(--ink);margin:0;line-height:1.35}
.entry .desc,.mod-desc,.card .desc,.card p,.entry-body p{color:var(--soft);font-size:12px;margin:0}
.mod-arrow,.card .arrow{margin-top:auto;padding-top:6px;align-self:flex-end;color:var(--accent,var(--gold));font-weight:800;font-size:13px}
.home .grid{grid-template-columns:1fr}
.entry.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;column-gap:18px;align-items:center;padding:17px 20px}
.ico{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:#fff;border:1px solid var(--accent,var(--deep));color:var(--accent,var(--deep));flex-shrink:0}
.ico svg{width:22px;height:22px}
.entry.row .ico{width:48px;height:48px}.entry.row .ico svg{width:26px;height:26px}
.ico.sm{width:28px;height:28px}.ico.sm svg{width:17px;height:17px}
.rgroup .section-title{align-items:center}
.section-title>.ico{color:var(--accent,var(--deep));font-size:inherit}
.has-ico{flex-direction:row!important;gap:14px!important;align-items:stretch}
.has-ico>.ico{align-self:flex-start}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.entry.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.entry.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;font-size:11px;color:var(--muted)}
.entry.row .title{font-size:17px}
.entry .go{color:var(--accent,var(--gold));font-weight:800;font-size:13px}
.status{border:1px solid var(--down);color:var(--down);padding:0 6px;font-size:10px}
.status.off{border-color:var(--line);color:var(--muted)}
.entry.inactive{background:var(--surface)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--soft);padding:0 6px;font-size:10px}
.entry-metrics{display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.entry-metrics strong{display:block;font-size:13px;color:var(--deep)}
.entry-metrics span{font-size:10px;color:var(--muted)}

/* 资产层日报：报告清单 */
.report-list a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px}
.report-list a:hover{background:var(--surface);color:var(--deep)}
.report-list a .arrow{color:var(--gold);font-weight:800}
.more-wrap{display:none}
.more-btn{width:100%;padding:8px 4px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--blue);font-size:12px;text-align:left;cursor:pointer;font-family:inherit}
.more-btn:hover{background:var(--surface)}
.empty{padding:12px 4px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.g-macro{--accent:#17366f;--tint:#eef3fa}.g-equity{--accent:#00873c;--tint:#edf6f0}.g-futures{--accent:#b8860b;--tint:#faf5e8}
.rgroup{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--tint);padding:2px 16px 8px}
.rgroup .section-title{margin-top:10px;border-bottom-color:var(--accent)}
.rgroup .section-title h2{color:var(--accent)}
.rgroup .report-list a:hover,.rgroup .more-btn:hover{background:#fff}
.rgroup .more-btn{color:var(--accent)}

.sub{color:var(--muted);font-size:11px}
.foot{margin-top:28px;border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:10px;letter-spacing:.04em}
@media(max-width:760px){.entry.row{grid-template-columns:44px minmax(0,1fr);row-gap:10px;column-gap:14px}.entry.row .ico{width:44px;height:44px}.entry.row .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.page{padding:14px 14px 40px}.masthead{flex-direction:column;align-items:flex-start;gap:4px}.brand{font-size:22px}.mh-meta{text-align:left}.stack,.grid{grid-template-columns:1fr}.intro h1{font-size:22px}.crumb{font-size:13px}.crumb a{display:inline-block;padding:6px 0}.report-list a{padding:12px 4px}.more-btn{padding:12px 4px}.mod-arrow,.card .arrow{padding-top:2px}.rgroup{padding:2px 12px 8px}}
</style>
</head>

  if (rest.length) {

    html += `<button class="more-btn" data-n="${rest.length}" onclick="toggleMore(this)">展开其余 ${rest.length} 篇 ▾</button>`;
  }
  el.innerHTML = html;
}
function toggleMore(btn) {
  const wrap = btn.previousElementSibling, open = wrap.style.display === "block";
  wrap.style.display = open ? "none" : "block";
  btn.textContent = open ? `展开其余 ${btn.dataset.n} 篇 ▾` : "收起 ▴";
}
