<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027年外资行宏观和资产展望</title>
<style>
:root{--bg:#eef2f6;--ink:#172739;--dim:#536578;--navy:#223e60;--line:#ccd8e4;--header:#e7eef5;--alt:#f6f9fc;--accent:#304f74}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.64 "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif}
main{max-width:1620px;margin:auto;padding:18px 22px 45px}
header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-bottom:7px;border-bottom:2px solid var(--navy)}
h1,h2,h3{color:var(--navy);margin:0;line-height:1.35}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}
small,.subtle{color:var(--dim)}
.site-back{color:var(--navy);display:inline-block;margin-bottom:7px;text-underline-offset:2px}
.section{background:#fff;border:1px solid var(--line);padding:12px 14px;margin-top:12px}
.navigation{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 0}
.nav,.jump,.chip{display:inline-block;text-decoration:none;border:1px solid #bacbdd;border-radius:4px;background:#f4f8fc;color:var(--navy)}
.nav{padding:6px 13px;font:inherit;font-weight:700;cursor:pointer}
.nav[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.nav[aria-pressed="false"]:hover,.jump:hover,.chip:hover{background:#dfeaf6}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.section-head .subtle{font-size:12px}
.scroll{overflow:auto;border:1px solid var(--line);border-bottom:0}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;line-height:1.42}
th,td{padding:4px 7px;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line);overflow-wrap:anywhere}
th{background:var(--header);text-align:left;color:var(--navy)}
th:last-child,td:last-child{border-right:0}
tbody tr:nth-child(even){background:var(--alt)}
.point{margin:0;padding:0}
.point+.point{border-top:1px solid #dfe7ef;margin-top:3px;padding-top:3px}
.code{color:#1c4876;font-weight:750;background:#e8f1fa;padding:0 4px;border-radius:3px;white-space:nowrap}
.title{font-weight:700;color:var(--navy);font-size:14px;margin:1px 0 2px}
.chip,.jump{padding:1px 5px;white-space:nowrap;font-size:11px;margin:1px 4px 2px 0}
.links{display:grid;gap:2px}
.report-link{color:#254d79;text-decoration:underline;text-decoration-color:#b0c3d8;text-underline-offset:2px;overflow-wrap:anywhere}
.report-link:hover{text-decoration-color:#254d79}
.extra-sources summary{font-size:11px;color:var(--dim);cursor:pointer}
.extra-sources .report-link{display:block;margin-top:2px}
.rating{display:inline-block;padding:0 6px;font-weight:700;white-space:nowrap;border-radius:3px;background:#edf1f5;color:#43576a}
.rating[data-grade="看多"]{background:#fbe7e4;color:#9b2929}.rating[data-grade="中性偏多"]{background:#fdf0e8;color:#994a27}
.rating[data-grade="看空"]{background:#e1f2e9;color:#146044}.rating[data-grade="中性偏空"]{background:#eaf4ed;color:#356348}
.rating-link{display:block;margin:1px 0;color:var(--navy);text-decoration:none;line-height:1.42}
.rating-link:hover .rating-name{text-decoration:underline}
.rating-name{margin-right:6px}
.rating-note{color:var(--dim);font-size:12px;margin:0 0 8px}
.annual-overview,.annual-card{border:1px solid var(--line);padding:8px 11px;min-width:0}
.annual-overview{border-left:3px solid #a74845;background:var(--alt)}
.annual-card{border-left:3px solid var(--navy)}
.annual-copy h2,.annual-copy h3,.annual-copy p{font-size:inherit;line-height:inherit;margin:0}
.annual-copy h2+p,.annual-copy h3+p{margin-top:3px}
.annual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.annual-highlights{margin:4px 0 0;padding-left:1.25em}
.annual-highlights li+li,.annual-points p+p{margin-top:4px}
.annual-highlights strong,.annual-points strong{margin-right:.45em}
.annual-points{margin-top:4px}
.annual-rating{margin-top:10px}
.annual-rating h2{font-size:inherit}
.annual-tools{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:7px}
.annual-tools>details[open]{flex-basis:100%}
.annual-tools summary{color:var(--navy);cursor:pointer}
.annual-refs{margin-top:5px}
.annual-refs dl{margin:4px 0}
.annual-refs dt{font-weight:700}
.annual-refs dd{margin:2px 0 6px}
.grade-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);margin-top:8px}
.grade-summary article{padding:7px 9px}
.grade-summary article+article{border-left:1px solid var(--line)}
.grade-summary p{display:grid;grid-template-columns:minmax(0,1fr);margin:4px 0}
.grade-summary .rating-link{margin:0}
.library-group{margin:12px 0 6px}
.library-notice{margin:0 0 8px;padding:7px 9px;border-left:3px solid var(--navy);background:var(--alt);color:var(--dim)}
.asset-tag{display:inline-block;margin:1px 4px 1px 0;padding:0 5px;background:#eaf1f9;border-radius:3px;color:#385670;font-size:11px}
.source-topic{display:block;font-size:12px;color:var(--dim);margin:1px 0 0}
.different{display:block;text-decoration:none;color:#6e471c;margin:2px 0;line-height:1.4}
.different:hover{text-decoration:underline}
.diff-name{color:#744812;font-weight:700}
.fig{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
select,input{max-width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #aebfd0;border-radius:4px;padding:4px 7px}
input{width:300px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4778ac;outline-offset:2px}
.brief{min-width:1020px}.detail,.conflicts,.ratings{min-width:1040px}.numbers{min-width:1040px}.sources{min-width:830px}
.numbers tbody tr.metric-row{background:var(--metric-bg)}
.numbers tbody tr.metric-row td:first-child{border-left:3px solid var(--metric-line)}
.numbers tbody tr.metric-start:not(:first-child) td{border-top:1px solid var(--metric-line)}
.numbers tbody td:nth-child(2),.numbers tbody td:nth-child(5){white-space:nowrap}
.ratings tbody tr.asset-row{background:var(--asset-bg)}
.ratings tbody tr.asset-row td:first-child{border-left:3px solid var(--asset-line)}
.ratings tbody tr.asset-start:not(:first-child) td{border-top:1px solid var(--asset-line)}
tr:target{background:#fff2dd!important}
@media screen and (max-width:780px){
  body{font-size:14px}
  main{padding:10px 10px 30px}
  header,.section-head{display:block}
  h1{font-size:21px}
  h1+small{display:block;margin-top:3px}
  .section{padding:10px}
  .section-head .subtle{display:block;margin-top:4px}
  .nav{min-height:44px;padding:5px 9px}
  select,input{min-height:44px;min-width:0}
  input[type="search"]{width:100%}
  .annual-grid,.grade-summary{grid-template-columns:1fr}
  .grade-summary article+article{border-top:1px solid var(--line);border-left:0}
  .scroll{overflow:visible;border:0}
  .scroll table,.scroll tbody,.scroll tr,.scroll td{display:block;min-width:0}
  .scroll colgroup{display:none}
  .scroll thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .scroll tbody tr{margin:0 0 8px;padding:7px 10px;border:1px solid var(--line);border-radius:4px}
  .scroll td,.scroll td:first-child,.scroll tr:not(:first-child) td{padding:4px 0;border:0}
  .scroll td:empty{display:none}
  .scroll td[data-label]::before{content:attr(data-label);display:block;font-size:12px;color:var(--dim);font-weight:700}
  .scroll .ratings tr.asset-row{border-left:3px solid var(--asset-line)}
  .scroll .numbers tr.metric-row{border-left:3px solid var(--metric-line)}
  .scroll .numbers tbody tr.metric-row td,.scroll .ratings tbody tr.asset-row td{border:0}
  .scroll .fig{text-align:left}
  .scroll .numbers tr,.scroll .sources tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px}
  .scroll .numbers td:is(:first-child,:nth-child(4),:nth-child(7),:last-child),.scroll .sources td:is(:nth-child(3),:last-child),
  .scroll td[colspan]{grid-column:1/-1}
}
@media print{main{padding:0}.navigation,.filters,.jump,#details{display:none}body{background:#fff;font-size:10px}.scroll{overflow:visible}.brief,.detail,.numbers,.sources,.conflicts,.ratings{min-width:0}tr{break-inside:avoid}}
</style>
</head>

  const unique=list.filter((x,i)=>list.findIndex(item=>item.id===x.id)===i);
  const [primary,...other]=unique;
  return '<div class="links">'+quote(primary)+(other.length?'<details class="extra-sources"><summary>另 '+other.length+' 篇</summary>'+
    other.map(quote).join('')+'</details>':'')+'</div>';
};
const badge = grade=>'<span class="rating" data-grade="'+escape(grade)+'">'+escape(grade)+'</span>';
const ratingLink = item=>'<a class="rating-link" data-rating="'+escape(item.key)+'" href="#rating-'+escape(item.key)+'">'+
  '<span class="rating-name">'+escape(item.subject)+'</span>'+badge(item.grade)+'</a>';
const header = (title, note='')=>'<div class="section-head"><h2>'+escape(title)+'</h2>'+ (note ? '<span class="subtle">'+note+'</span>' : '')+'</div>';
const tr = (values, attrs='')=>({values,attrs});
const rowId = id=>'id="'+escape(id)+'"';
const table = (kind, headings, widths, rows)=>{
  const columns=widths.map(w=>w===null?'<col>':'<col style="width:'+(typeof w==='number'?w+'%':w)+'">').join('');
  const titles=headings.map(h=>'<th role="columnheader" scope="col">'+escape(h)+'</th>').join('');
  const body=rows.map(({values,attrs})=>'<tr role="row" '+attrs+'>'+values.map((value,i)=>
    '<td role="cell" data-label="'+escape(headings[i])+'">'+value+'</td>').join('')+'</tr>').join('');
  return '<div class="scroll"><table class="'+kind+'" role="table"><colgroup>'+columns+'</colgroup>'+
    '<thead role="rowgroup"><tr role="row">'+titles+'</tr></thead><tbody role="rowgroup">'+
    (body||'<tr role="row"><td role="cell" colspan="'+headings.length+'">暂无匹配的观点。</td></tr>')+'</tbody></table></div>';
};
const options = (label, values)=>'<option value="">'+escape(label)+'</option>'+values.map(value=>{
  const [key,text]=Array.isArray(value)?value:[value,value];
  return '<option value="'+escape(key)+'">'+escape(text)+'</option>';
}).join('');
const detailState={mode:'',label:'',org:'',search:''};

function showAnnual(){
  const highlights=data.annualHighlights.map(item=>'<li><strong>'+escape(item.label)+'</strong>'+marked(item.text)+'</li>');
  const cards=data.annual.map(item=>'<article class="annual-card"><h3>'+escape(item.section)+'</h3><div class="annual-points">'+
    item.points.map(point=>'<p><strong>'+escape(point.label)+'</strong>'+marked(point.text)+'</p>').join('')+'</div></article>');
  const citations=data.annual.map(item=>'<dl><dt>'+escape(item.section)+'</dt><dd>'+refs(item.refs)+'</dd></dl>');
  const grades=data.ratingLevels.map(([name])=>{
    const items=data.ratings.filter(item=>item.grade===name);
    return '<article>'+badge(name)+'<p>'+items.map(item=>'<a class="rating-link" data-rating="'+escape(item.key)+
      '" href="#rating-'+escape(item.key)+'">'+escape(item.subject)+'</a>').join('')+'</p></article>';
  });
  $('view').innerHTML='<div class="annual-copy"><div class="annual-overview"><h2>核心结论</h2><p><strong>'+
    escape(data.lead)+'</strong></p><ul class="annual-highlights">'+highlights.join('')+'</ul></div>'+
    '<div class="annual-grid">'+cards.join('')+'</div></div>'+
    '<section class="annual-rating"><h2>配置评级速览</h2><div class="grade-summary">'+grades.join('')+'</div></section>'+
    '<div class="annual-tools">'+
    '<details><summary>总结出处</summary><div class="annual-refs">'+citations.join('')+'</div></details></div>';
}

function showRatings(){
  const categories=[...new Set(data.ratings.map(item=>item.asset))];
  const legend=data.ratingLevels.map(([grade,description])=>'<span title="'+escape(description)+'">'+badge(grade)+'</span>').join(' ');
  $('view').innerHTML=header('配置评级',legend)+'<p class="rating-note">'+escape(data.ratingContext)+'</p>'+
    '<div class="filters"><select id="rating-asset" aria-label="评级资产">'+options('全部资产',categories)+'</select>'+
    '<select id="rating-grade" aria-label="评级档位">'+options('全部评级',data.ratingLevels.map(x=>x[0]))+
    '</select></div><div id="rating-grid"></div>';
  const draw=()=>{
    const asset=$('rating-asset').value, grade=$('rating-grade').value;
    const matches=data.ratings.filter(x=>(!asset||asset===x.asset)&&(!grade||grade===x.grade));
    $('rating-grid').innerHTML=table('ratings',['资产／标的','综合评级','期限与口径','评级依据','升降级条件','原文'],
      ['clamp(130px,10vw,155px)','83px','clamp(122px,10vw,152px)',29,23,null],
      matches.map((x,i)=>{
        const [bg,line]=data.ratingAssetBands[x.asset];
        const first=i===0 || matches[i-1].asset!==x.asset;
        const attrs=rowId('rating-'+x.key)+' class="asset-row'+(first?' asset-start':'')+'" data-asset="'+
          escape(x.asset)+'" style="--asset-bg:'+bg+';--asset-line:'+line+'"';
        return tr(['<strong>'+escape(x.subject)+'</strong><div class="subtle">'+escape(x.asset)+'</div>',
          badge(x.grade),escape(x.period),marked(x.basis),escape(x.condition),refs(x.refs)],attrs);
      }));
  };
  $('rating-asset').addEventListener('change',draw);
  $('rating-grade').addEventListener('change',draw);
  draw();
}

function showBrief(mode){
  const rows=data.briefs.filter(item=>item.mode===mode);
  const title={资产:'大类资产观点',国别:'国别与地区展望',机构:'机构配置与交易'}[mode];
  const ratingColumn=mode==='资产';
  const headings=[{资产:'资产',国别:'国别或地区',机构:'机构'}[mode]+' / 判断',
    ...(ratingColumn?['综合评级']:[]),'机构观点','关注条件与同机构差异','原文'];
  const widths=ratingColumn?['clamp(114px,10vw,160px)','clamp(150px,12vw,186px)',36,20,null]:
    ['clamp(145px,12vw,185px)',43,23,null];
  $('view').innerHTML=header(title)+table('brief',headings,widths,rows.map(item=>{
    const label=mode==='机构'?code(item.label)+' '+escape(data.institutions[item.label]):escape(item.label);
    const links=item.conflicts.map(key=>{
      const diff=different.get(key);
      return '<a class="different" href="#'+key+'" data-conflict="'+key+'"><span class="diff-name">'+code(diff.code)+' '+escape(diff.subject)+'</span> · '+escape(diff.basis)+'</a>';
    }).join('');
    return tr([
      '<strong>'+label+'</strong><p class="title">'+escape(item.title)+'</p><a class="jump" href="#details" data-detail="'+escape(item.label)+'">观点明细</a>',
      ...(ratingColumn?[data.ratings.filter(x=>x.asset===item.label).map(ratingLink).join('')]:[]),
      item.points.map(point=>'<p class="point">'+marked(point)+'</p>').join(''),
      marked(item.condition)+links,refs(item.refs)
    ]);
  }));
  $('view').querySelectorAll('[data-detail]').forEach(link=>link.addEventListener('click',event=>{
    event.preventDefault();
    Object.assign(detailState,{mode,label:link.dataset.detail,org:'',search:''});
    showDetail();
    $('details').scrollIntoView({block:'start'});
  }));
  $('view').querySelectorAll('[data-conflict]').forEach(link=>link.addEventListener('click',event=>{
    event.preventDefault();
    const key=link.dataset.conflict;
    setMode('差异');
    window.location.hash=key;
    $(key).scrollIntoView({block:'center'});
  }));
}

function showDetail(){
  const {mode,label}=detailState;
  const base=data.views.filter(item=>mode==='资产' ? item.asset===label : mode==='机构' ? item.code===label : item.markets.includes(label));
  $('details').hidden=false;
  $('details').innerHTML=header((mode==='机构'?data.institutions[label]:label)+'观点明细')+
    '<div class="filters"><select id="detail-org" aria-label="机构">'+options('全部机构',
      [...new Set(base.map(item=>item.code))].map(id=>[id,'('+id+') '+data.institutions[id]]))+'</select>'+
    '<input type="search" id="query" aria-label="搜索观点" placeholder="搜索观点或标的"></div><div id="detail-grid"></div>';
  const draw=()=>{
    const org=$('detail-org').value, term=$('query').value.trim().toLowerCase();
    const rows=base.filter(x=>(!org||x.code===org)&&(!term||Object.values(x).join(' ').toLowerCase().includes(term)));
    $('detail-grid').innerHTML=table('detail',['机构 / 标的','预测','交易表达','驱动','风险与条件','原文'],
      ['clamp(140px,11vw,165px)',22,19,16,13,null],
      rows.map(x=>tr([code(x.code)+' <strong>'+escape(x.subject)+'</strong>',escape(x.forecast),
        escape(x.trade),escape(x.logic),escape(x.risk),quote(x)])));
  };
  $('detail-org').addEventListener('change',draw);
  $('query').addEventListener('input',draw);
  draw();
}

function showConflicts(){
  $('view').innerHTML=header('同机构差异')+
    table('conflicts',['机构 / 标的','口径','观点对照','差异来源或适用条件','原文'],['155px','130px',30,28,null],
      data.conflicts.map(x=>tr([code(x.code)+' <strong>'+escape(x.subject)+'</strong>',escape(x.basis),
        escape(x.views),escape(x.meaning),refs(x.refs)],rowId(x.key))));
}

function showNumbers(){
  const names=[...new Set(data.forecasts.map(x=>x.metric))];
  $('view').innerHTML=header('关键预测值')+
    '<div class="filters"><select id="metric" aria-label="预测指标">'+options('全部指标',names)+'</select></div><div id="number-grid"></div>';
  const formatValue = x=>new Intl.NumberFormat('zh-CN',{
    minimumFractionDigits:x.metric.includes('/') && x.value<10 ? 2 : 0,maximumFractionDigits:3
  }).format(x.value);
  const draw=()=>{
    const name=$('metric').value;
    const matches=data.forecasts.filter(x=>!name||x.metric===name);
    const widths=['clamp(166px,12.4vw,200px)','71px','clamp(110px,8.6vw,135px)','103px',
      '69px','93px','clamp(154px,14.5vw,215px)',null];
    $('number-grid').innerHTML=table('numbers',['指标','机构','期限','情景','预测值','单位','口径','原文'],
      widths,matches.map((x,i)=>{
        const [bg,line]=data.forecastGroups[x.metric];
        const first=i===0 || matches[i-1].metric!==x.metric;
        const attrs='class="metric-row'+(first?' metric-start':'')+'" data-metric="'+escape(x.metric)+
          '" style="--metric-bg:'+bg+';--metric-line:'+line+'"';
        return tr(['<strong>'+escape(x.metric)+'</strong>',code(x.code),escape(x.period),escape(x.case),
          '<div class="fig">'+formatValue(x)+'</div>',escape(x.unit),escape(x.note),quote(x)],attrs);
      }));
  };
  $('metric').addEventListener('change',draw);
  draw();
}

function showSources(){
  const categories=['宏观策略','利率外汇与信用','大宗商品','重要行业观点'];
  const assets=[...new Set(data.sources.flatMap(x=>x.assets))].sort();
  $('view').innerHTML=header('研报库','<span id="library-count" aria-live="polite"></span>')+
    '<p class="library-notice"><strong>仅供内部团队分享。</strong>禁止商业用途、公开转载或对外转发。研报版权归原发布机构或相关权利人所有。</p>'+
    '<div class="filters"><select id="library-category" aria-label="报告分类">'+options('全部分类',categories)+'</select>'+
    '<select id="library-org" aria-label="研报机构">'+options('全部机构',Object.entries(data.institutions).map(([id,name])=>[id,'('+id+') '+name]))+'</select>'+
    '<select id="library-asset" aria-label="涉及资产">'+options('全部资产',assets)+'</select>'+
    '<input id="library-query" type="search" aria-label="搜索研报" placeholder="搜索研报标题、主题或日期"></div><div id="library-grid"></div>';
  const draw=()=>{
    const category=$('library-category').value, org=$('library-org').value, asset=$('library-asset').value;
    const terms=$('library-query').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    const rows=data.sources.filter(x=>(!category||x.category===category)&&(!org||x.code===org)&&
      (!asset||x.assets.includes(asset))&&terms.every(t=>[x.name,x.title,x.org,x.code,x.date,x.file].join(' ').toLowerCase().includes(t)));
    $('library-count').textContent=rows.length+' / '+data.sources.length+' 篇 PDF';
    $('library-grid').innerHTML=rows.length ? categories.map(group=>{
      const items=rows.filter(x=>x.category===group);
      if(!items.length) return '';
      return '<h3 class="library-group">'+escape(group)+'（'+items.length+'）</h3>'+
        table('sources',['原刊日期','机构','研报标题','报告类型','涉及资产'],
          ['108px','140px',null,'118px','clamp(145px,15vw,210px)'],items.map(x=>tr([
          escape(x.date),code(x.code)+' '+escape(x.org),quote({id:x.id})+'<span class="source-topic">'+escape(x.title)+'</span>',
          escape(x.type),x.assets.map(a=>'<span class="asset-tag">'+escape(a)+'</span>').join('')
        ])));
    }).join('') : '<p>暂无匹配的研报。</p>';
  };
  for(const id of ['library-category','library-org','library-asset']) $(id).addEventListener('change',draw);
  $('library-query').addEventListener('input',draw);
  draw();
}

function setMode(mode){
  nodes.forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===mode)));
  $('details').hidden=true;
  if(mode==='总结') showAnnual();
  if(mode==='评级') showRatings();
  if(['资产','国别','机构'].includes(mode)) showBrief(mode);
  if(mode==='差异') showConflicts();
  if(mode==='预测') showNumbers();
  if(mode==='原文') showSources();
}
$('view').addEventListener('click',event=>{
  const link=event.target.closest('[data-rating]');
  if(!link) return;
  event.preventDefault();
  const key='rating-'+link.dataset.rating;
  setMode('评级');
  window.location.hash=key;
  $(key).scrollIntoView({block:'center'});
});
nodes.forEach(node=>node.addEventListener('click',()=>{
  if(window.location.hash) history.replaceState(null,'',window.location.pathname);
  setMode(node.dataset.mode);
  if(node.dataset.mode==='原文') history.replaceState(null,'','#library');
}));
const target=window.location.hash.slice(1);
const directRating=data.ratings.some(x=>'rating-'+x.key===target);
setMode(different.has(target)?'差异':directRating?'评级':target==='library'?'原文':'总结');
if(different.has(target)||directRating) requestAnimationFrame(()=>$(target).scrollIntoView({block:'center'}));
</script>
</body>
</html>
