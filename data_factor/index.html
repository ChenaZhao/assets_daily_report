<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数据及因子库</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f6f2;
      color: #17211c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page { max-width: 980px; margin: 0 auto; padding: 34px 22px 54px; }
    .back { color: #707a74; text-decoration: none; font-size: 13px; font-weight: 700; }
    .back:hover { color: #198b2d; }
    header { margin: 20px 0 22px; }
    .eyebrow { margin: 0 0 7px; color: #707a74; font-size: 13px; font-weight: 700; }
    h1 { margin: 0; font-size: 34px; line-height: 1.12; }
    .meta { margin: 9px 0 0; color: #707a74; font-size: 13px; }
    .stack { display: grid; gap: 14px; }
    .entry-card {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 18px 20px;
      border: 1px solid #dce3dc;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(31, 40, 34, 0.07);
    }
    .entry-card:hover { border-color: #9ec6a5; transform: translateY(-1px); transition: .16s ease; }
    .entry-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border-radius: 8px;
      background: #e6f3e9;
      color: #198b2d;
      font-weight: 900;
      font-size: 15px;
    }
    h2 { margin: 0 0 5px; font-size: 19px; line-height: 1.25; }
    p { margin: 0; color: #707a74; font-size: 13px; line-height: 1.55; }
    .entry-metrics { display: flex; gap: 18px; align-items: center; border-left: 1px solid #dce3dc; padding-left: 20px; }
    .entry-metrics div { min-width: 86px; }
    .entry-metrics strong { display: block; font-size: 20px; line-height: 1.1; }
    .entry-metrics span { display: block; margin-top: 5px; color: #707a74; font-size: 11.5px; font-weight: 700; }
    @media (max-width: 720px) {
      .entry-card { grid-template-columns: 1fr; gap: 12px; }
      .entry-label { width: max-content; padding: 0 16px; }
      .entry-metrics { border-left: 0; border-top: 1px solid #dce3dc; padding: 12px 0 0; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="../">← 返回首页</a>
    <header>

    </header>
    <section class="stack" aria-label="数据页面入口">
      <a class="entry-card" href="qis.html">
          <div class="entry-label">QIS</div>

            <h2>QIS 策略库</h2>
            <p>策略指数表现、回撤、滚动风险与近期表现。</p>
          </div>
          <div class="entry-metrics"><div><strong>63/109</strong><span>最新覆盖</span></div><div><strong>2026-07-10</strong><span>最新日期</span></div></div>
        </a>
        <a class="entry-card" href="futures.html">
          <div class="entry-label">FUT</div>

            <h2>连续期货</h2>
            <p>连续合约价格走势、最新行情与区间涨跌。</p>
          </div>
          <div class="entry-metrics"><div><strong>93</strong><span>最新覆盖</span></div><div><strong>2026-07-10</strong><span>最新日期</span></div></div>
        </a>
        <a class="entry-card" href="macro_tcode.html">
          <div class="entry-label">TCode</div>
          <div class="entry-body">
            <h2>Macro TCode</h2>
            <p>宏观指标走势、最新目标期与发布更新情况。</p>
          </div>
          <div class="entry-metrics"><div><strong>75/154</strong><span>最新覆盖</span></div><div><strong>2026-06-30</strong><span>最新目标日期</span></div><div><strong>2026-07-10</strong><span>最新更新日期</span></div></div>
        </a>
    </section>
  </main>
</body>
</html>
